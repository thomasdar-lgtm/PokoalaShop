<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00071a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PoKoalaShop">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@800;900&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>PoKoalaShop</title>
<style>
:root{
--bg:#00071a;--surf:#0b1430;--surf2:#152045;--surf3:#202c58;
--red:#E3350D;--redS:rgba(227,53,13,.16);
--yel:#FFCB05;--yelS:rgba(255,203,5,.14);
--gold:#F0D890;
--grn:#4ECB8D;--grnS:rgba(78,203,141,.14);
--blu:#5CB4F7;--bluS:rgba(92,180,247,.14);
--dng:#FF7A8A;--dngS:rgba(255,122,138,.14);
--tx:#eaeaf2;--tx2:#8c9ac0;--tx3:#556289;
--bd:rgba(255,255,255,.08);--r:14px;--r2:9px;
}
html{overscroll-behavior-y:none;height:100%}
body,body *{-webkit-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
input:not([type=file]),textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.card,.aBtn,.nv,.sBtn,.st,.selBar,
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);max-width:560px;margin:0 auto;padding-bottom:calc(70px + env(safe-area-inset-bottom));overscroll-behavior-y:none;overscroll-behavior-x:none}
input,select,textarea,button{font-family:inherit}
.hide{display:none!important}

/* AUTH */
#auth{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px;text-align:center}
.aLogo{width:132px;margin-bottom:18px}
.aTit{font-family:Raleway,-apple-system,sans-serif;font-weight:900;font-size:31px;letter-spacing:-.7px;line-height:1}
.aTit .p{color:var(--red)}.aTit .k{color:var(--yel)}.aTit .s{color:var(--gold);font-size:18px;margin-left:3px;letter-spacing:.8px}
.aSub{color:var(--tx2);font-size:14px;margin:6px 0 34px}
.gBtn{display:flex;align-items:center;gap:10px;background:#fff;color:#2c2c3a;border:0;border-radius:11px;padding:13px 26px;font-size:15px;font-weight:700;cursor:pointer}

/* HEADER */
header{position:sticky;top:0;z-index:60;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 0}
.hTop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:9px}
.brand img{width:38px;height:auto;display:block;flex:none}
.wm{font-family:Raleway,-apple-system,sans-serif;font-weight:900;font-size:21px;letter-spacing:-.5px;line-height:1}
.wm .p{color:var(--red)}.wm .k{color:var(--yel)}.wm .s{color:var(--gold);font-size:13px;margin-left:2px;letter-spacing:.6px}
.hRight{display:flex;align-items:center;gap:8px}
.sync{font-size:10px;color:var(--tx3);display:flex;align-items:center;gap:4px}
.syncDot{width:6px;height:6px;border-radius:50%;background:var(--grn)}
.syncDot.busy{background:var(--yel)}
.syncDot.err{background:var(--dng)}
.iBtn{background:var(--surf2);border:0;color:var(--tx2);width:32px;height:32px;border-radius:9px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.srch{position:relative;margin-bottom:10px}
.srch input{width:100%;background:var(--surf);border:1px solid var(--bd);border-radius:11px;padding:10px 34px 10px 34px;color:var(--tx);font-size:14px;outline:none}
.srch input::-webkit-search-cancel-button,
.srch input::-webkit-search-decoration,
.srch input::-webkit-search-results-button{-webkit-appearance:none;appearance:none;display:none}
.srch input:focus{border-color:var(--red)}
.srch .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:13px}
.srch .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:var(--surf2);border:0;color:var(--tx2);width:22px;height:22px;border-radius:50%;font-size:13px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding-bottom:10px}
.st{background:var(--surf);border-radius:10px;padding:7px 4px;text-align:center}
.stV{font-size:17px;font-weight:800;line-height:1.1}
.stL{font-size:9.5px;color:var(--tx2);margin-top:2px}
.st.a .stV{color:var(--red)}.st.b .stV{color:var(--yel)}.st.c .stV{color:var(--blu)}.st.d .stV{color:var(--grn);font-size:14px}

/* CONTENT */
main{padding:4px 16px 20px}
.sortBar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.sBtn{display:flex;align-items:center;gap:4px;background:var(--surf);border:1px solid var(--bd);color:var(--tx2);font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:20px;cursor:pointer}
.sBtn.on{background:var(--redS);border-color:transparent;color:var(--red)}






.accSec{font-size:10.5px;font-weight:800;color:var(--tx3);letter-spacing:.8px;text-transform:uppercase;padding:0 18px;margin:18px 0 8px}
.accBtn{width:calc(100% - 36px);margin:0 18px 8px;background:var(--surf2);border:1px solid transparent;border-radius:var(--r2);padding:12px 13px;color:var(--tx);font-size:14px;font-weight:600;cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px}
.accBtn span{font-size:11.5px;color:var(--tx2);font-weight:500;text-align:right}
.bakRow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:calc(100% - 36px);margin:0 18px 7px;background:var(--surf2);border:1px solid transparent;border-radius:var(--r2);padding:11px 13px;color:var(--tx);font-size:13.5px;font-weight:600;cursor:pointer;text-align:left}
.bakRow .n{font-size:11.5px;color:var(--tx2);font-weight:500}
.sBtn .ar{font-size:9px;opacity:.85;line-height:1}
.secH{font-size:10.5px;font-weight:800;color:var(--tx3);letter-spacing:.9px;text-transform:uppercase;margin:16px 0 9px;display:flex;align-items:center;gap:7px}
.secH:first-child{margin-top:4px}
.secH span{background:var(--surf2);color:var(--tx2);border-radius:9px;padding:1px 6px;font-size:9.5px;letter-spacing:0}

/* CARD */
.card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:8px;overflow:hidden;cursor:pointer;transition:border-color .12s,background .12s}
.card.sel{border-color:var(--grn);background:rgba(78,203,141,.13)}
.card.selOff{opacity:.42}
.selBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));width:100%;max-width:560px;background:var(--surf2);border-top:1px solid var(--bd);padding:10px 14px calc(12px + env(safe-area-inset-bottom));display:none;align-items:center;gap:10px;z-index:110}
.selBar.on{display:flex}
.selN{font-size:13px;font-weight:700;flex:1}
.selN span{display:block;font-size:11px;color:var(--tx2);font-weight:500;margin-top:1px}
.selBar button{border:0;border-radius:9px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer}
.selGo{background:var(--grn);color:#062416}
.selX{background:var(--surf3);color:var(--tx2)}
.msRow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.msRow:last-child{border-bottom:0}
.msNm{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msNm span{display:block;font-size:11px;color:var(--tx2)}
.msIn{width:88px;background:var(--surf2);border:1px solid var(--bd);border-radius:8px;padding:8px 9px;color:var(--tx);font-size:14px;outline:none;text-align:right}
.msIn:focus{border-color:var(--grn)}
.msTot{display:flex;justify-content:space-between;align-items:center;background:var(--surf2);border-radius:var(--r2);padding:11px 13px;margin:12px 18px 0;font-size:13px}
.msTot b{font-size:18px;color:var(--grn)}
.cIn{display:flex;min-height:70px}
.cPh{width:76px;flex-shrink:0;align-self:stretch;background:var(--surf2);display:flex;align-items:center;justify-content:center;color:var(--tx3);cursor:pointer;overflow:hidden;position:relative}
.cPh img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cPh.has .ph-holder{display:none}
#lb{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,2,10,.94);align-items:center;justify-content:center;padding:16px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
#lbX{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;background:rgba(255,255,255,.14);border:0;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:9px}
.cBd{flex:1;padding:8px 11px;min-width:0}
.cNm{font-size:14px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cSub{font-size:11px;color:var(--tx2);margin-top:2px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.chip{font-size:10.5px;padding:2px 7px;border-radius:9px;font-weight:600;white-space:nowrap}
.cA{background:var(--redS);color:var(--red)}
.cY{background:var(--yelS);color:var(--yel)}
.cG{background:var(--grnS);color:var(--grn)}
.cB{background:var(--bluS);color:var(--blu)}
.cO{background:var(--bluS);color:var(--blu)}
.acts{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.aBtn{font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;border:0;cursor:pointer;background:var(--surf2);color:var(--tx2)}
.aBtn.p{background:var(--redS);color:var(--red)}
.aBtn.g{background:var(--grnS);color:var(--grn)}
.aBtn.y{background:var(--yelS);color:var(--yel)}
.aBtn.o{background:var(--bluS);color:var(--blu)}
.aBtn.d{background:var(--dngS);color:var(--dng)}

/* ORDER */
.ord{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:10px;overflow:hidden}

.ordN{font-size:14px;font-weight:700}
.ordM{font-size:11px;color:var(--tx2);margin-top:2px}
.ordT{font-size:16px;font-weight:800;color:var(--grn)}

.ordI{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px;cursor:pointer}
.ordI:active{opacity:.62}
.ordI:last-child{border-bottom:0}
.ordI .th{width:34px;height:34px;border-radius:7px;background:var(--surf2);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--tx3)}
.ordI .th img{width:100%;height:100%;object-fit:cover}
.ordI .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ordI .pr{color:var(--grn);font-weight:700;font-size:12.5px}


/* HISTO */
.hCard{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:9px;padding:12px 13px}
.hTitle{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hName{font-size:15px;font-weight:700}
.hCnt{font-size:11px;color:var(--tx2)}
.hStats{display:flex;gap:14px;margin-top:7px;font-size:11px;color:var(--tx2)}
.hStats b{color:var(--tx);font-size:13px;display:block;font-weight:700}
.hList{margin-top:10px;border-top:1px solid var(--bd);padding-top:8px}
.hRow{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 0;color:var(--tx2)}
.hRow b{color:var(--grn);font-weight:700}
.hCard{cursor:pointer}
.hvList{padding:0 18px}
.hvRow{display:flex;gap:10px;background:var(--surf2);border-radius:var(--r2);padding:10px 12px;margin-bottom:8px;cursor:pointer}
.hvRow:active{opacity:.65}
.hvPh{width:52px;height:52px;flex:none;border-radius:8px;background:var(--surf3);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;color:var(--tx3)}
.hvPh img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hvPh.has .ph-holder{display:none}
.hvMain{flex:1;min-width:0}
.roRow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:13.5px}
.roRow:last-child{border-bottom:0}
.roRow i{color:var(--tx2);font-style:normal;flex:none}
.roRow b{text-align:right;font-weight:600;word-break:break-word}
.roPh{width:100%;height:190px;border-radius:var(--r2);background:var(--surf2);overflow:hidden;position:relative;cursor:zoom-in;display:flex;align-items:center;justify-content:center;color:var(--tx3)}
.roPh img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#00040f}
.roPh.has .ph-holder{display:none}
.gToggle{display:flex;gap:6px;margin-bottom:10px}
.gToggle button{flex:1;background:var(--surf);border:1px solid var(--bd);color:var(--tx2);font-size:12px;font-weight:700;padding:8px;border-radius:20px;cursor:pointer}
.gToggle button.on{background:var(--redS);border-color:transparent;color:var(--red)}
.hvTop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hvDate{font-size:13px;font-weight:600}
.hvPrice{font-size:15px;font-weight:800;color:var(--grn)}
.hvMeta{font-size:11.5px;color:var(--tx2);margin-top:3px}
.hvActs{display:flex;gap:6px;margin-top:9px}

/* EMPTY */
.empty{text-align:center;padding:52px 22px;color:var(--tx3)}
.empty .e1{margin-bottom:14px;opacity:.5;color:var(--tx3)}
.empty .e2{font-size:14px;line-height:1.5}

/* SHEET */
.ovl{display:none;position:fixed;inset:0;z-index:200;background:rgba(6,6,12,.72);align-items:flex-end;justify-content:center}
.ovl.on{display:flex}
.sheet{background:var(--surf);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:93vh;overflow-y:auto;padding-bottom:calc(26px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:36px;height:4px;background:var(--surf3);border-radius:3px;margin:11px auto 4px}
.shT{font-size:16px;font-weight:800;padding:6px 18px 4px}
.shHd{position:relative;display:flex;align-items:center;justify-content:center;padding:2px 0 10px}
.shHd .shT{padding:0;text-align:center}
.shHd .shC{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:9px;border:1px solid var(--bd);background:var(--surf);color:var(--tx2);font-size:17px;font-weight:700;line-height:1;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.shHd .shC:active{color:var(--tx)}
.shS{font-size:12px;color:var(--tx2);padding:0 18px 12px}
.fld{padding:0 18px;margin-bottom:13px}
.lbl{font-size:11.5px;color:var(--tx2);font-weight:600;margin-bottom:5px;display:block}
.inp{width:100%;background:var(--surf2);border:1px solid var(--bd);border-radius:var(--r2);padding:11px 12px;color:var(--tx);font-size:15px;outline:none}
.inp:focus{border-color:var(--red)}
textarea.inp{height:66px;resize:none;font-size:13px;line-height:1.5}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px;margin-bottom:13px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 18px;margin-bottom:13px}
.row2 .fld,.row3 .fld{padding:0;margin:0}
.phZ{width:100%;height:106px;background:var(--surf2);border:2px dashed var(--bd);border-radius:var(--r2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--tx3);font-size:12.5px;position:relative;cursor:pointer;overflow:hidden}
.phZ input{position:absolute;inset:0;opacity:0;cursor:pointer}
.phZ img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#00040f}
.phZ.has .ph-holder{display:none}
.phE{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.65);border:0;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;z-index:5;display:none;align-items:center;justify-content:center;padding:6px}
.phZ.has input{display:none}
.phZ.has{cursor:zoom-in;border-style:solid}
.phZ.has .phE{display:flex}
.phZ.has .phX{display:flex}
.phX{display:none;align-items:center;justify-content:center;padding:6px}
.phX{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.65);border:0;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;z-index:5}
.shF{display:flex;gap:9px;padding:6px 18px 0}
.bP{flex:1;background:var(--red);color:#fff;border:0;border-radius:var(--r2);padding:13px;font-size:15px;font-weight:700;cursor:pointer}
.bP.g{background:var(--grn)}.bP.r{background:var(--dng);color:#2b0a10}
.bS{background:var(--surf2);color:var(--tx2);border:0;border-radius:var(--r2);padding:13px 18px;font-size:15px;font-weight:600;cursor:pointer}
.dgr{width:calc(100% - 36px);margin:14px 18px 0;background:transparent;border:1px solid var(--dngS);color:var(--dng);border-radius:var(--r2);padding:10px;font-size:13px;font-weight:600;cursor:pointer}

/* CONFIRM */
.cfm{display:none;position:fixed;inset:0;z-index:300;background:rgba(6,6,12,.8);align-items:center;justify-content:center;padding:24px}
.cfm.on{display:flex}
.cfmB{background:var(--surf);border-radius:var(--r);padding:22px 20px;width:100%;max-width:310px;text-align:center}
.cfmT{font-weight:800;font-size:15px;margin-bottom:7px}
.cfmX{font-size:13px;color:var(--tx2);margin-bottom:18px;line-height:1.5}

/* TOAST */
#toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(12px);background:var(--surf3);color:var(--tx);padding:10px 18px;border-radius:22px;font-size:13px;font-weight:600;z-index:400;opacity:0;transition:.24s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}

/* NAV */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:var(--surf);border-top:1px solid var(--bd);display:flex;padding:9px 0 calc(9px + env(safe-area-inset-bottom));z-index:100;overflow:hidden}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--tx3);font-size:10px;font-weight:600;position:relative;padding-top:2px;transition:color .15s}
.nv+.nv::after{content:'';position:absolute;left:0;top:22%;bottom:22%;width:1px;background:var(--bd)}
.nv::before{content:'';position:absolute;top:-8px;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:transparent;transition:background .15s}
.nv.on::before{background:var(--gold)}
.nv.on{color:var(--gold)}
.nvI{width:21px;height:21px;display:block}
.nvB{position:absolute;top:-2px;right:50%;margin-right:-20px;background:var(--blu);color:#00071a;font-size:9px;font-weight:800;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.fab{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom));right:max(16px,calc(50% - 264px));width:52px;height:52px;border-radius:50%;background:var(--red);color:#fff;border:0;font-size:27px;font-weight:300;cursor:pointer;z-index:99;box-shadow:0 5px 18px rgba(124,106,247,.42);display:flex;align-items:center;justify-content:center}
.hint{font-size:11.5px;color:var(--tx3);text-align:center;padding:14px 20px 0;line-height:1.5}

/* ═══ TABLETTE / GRAND ÉCRAN ═══ */
@media (min-width:760px){
  body{max-width:1060px;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
  header{padding-left:22px;padding-right:22px}
  main{padding:6px 22px 28px}
  nav{max-width:1060px;padding:10px 0 calc(11px + env(safe-area-inset-bottom))}
  .nv{font-size:11px;gap:4px}

function $(id){ return document.getElementById(id); }
function norm(s){
  return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function noAuto(){

function nid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function eur(n){ return (n==null?0:n).toFixed(2).replace('.',',') + '€'; }
function eur0(n){ return Math.round(n==null?0:n) + '€'; }
function toDateInput(iso){
  if(!iso) return '';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  var m = String(d.getMonth()+1).padStart(2,'0'), j = String(d.getDate()).padStart(2,'0');
  return d.getFullYear() + '-' + m + '-' + j;
}
function fromDateInput(v){
  if(!v) return null;
  var p2 = v.split('-');
  if(p2.length !== 3) return null;
  var d = new Date(parseInt(p2[0],10), parseInt(p2[1],10)-1, parseInt(p2[2],10), 12, 0, 0);
  if(isNaN(d.getTime())) return null;
  return d.toISOString();
}
function ageDays(s){
  if(!s) return null;
  var d = new Date(s);
  if(isNaN(d.getTime())) return null;
  var a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var n = new Date();
  var b = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.round((b - a) / 86400000);
}
function ageTxt(s){
  var d = ageDays(s);
  if(d == null) return '';
  if(d <= 0) return 'mis en ligne aujourd\'hui';
  if(d === 1) return 'mis en ligne hier';
  return 'mis en ligne il y a ' + d + ' jours';
}
function dt(s){ if(!s) return '—'; var d=new Date(s); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'}); }

/* ═══ IDB (cache photos) ═══ */
var idb = null;
function openIdb(){
  return new Promise(function(res){
    var r = indexedDB.open('pokoalashop', 1);
    r.onupgradeneeded = function(e){
      var db = e.target.result;
      if(!db.objectStoreNames.contains('ph')) db.createObjectStore('ph');
    };
    r.onsuccess = function(e){ idb = e.target.result; res(); };
    r.onerror = function(){ res(); };
  });
}
function idbGet(k){
  return new Promise(function(res){
    if(!idb) return res(null);
    var t = idb.transaction('ph','readonly').objectStore('ph').get(k);
    t.onsuccess = function(){ res(t.result || null); };
    t.onerror = function(){ res(null); };
  });
}
function idbPut(k, v){
  return new Promise(function(res){
    if(!idb) return res();
    var t = idb.transaction('ph','readwrite').objectStore('ph').put(v, k);
    t.onsuccess = function(){ res(); }; t.onerror = function(){ res(); };
  });
}

/* ═══ AUTH ═══ */
function initGis(){
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPES,
    callback: function(r){
      if(r.error){ toast('Connexion refusée'); return; }
      token = r.access_token;
      tokenExp = Date.now() + (parseInt(r.expires_in,10) || 3500) * 1000;
      try{ localStorage.setItem(LS + 'tk', JSON.stringify({ t: token, e: tokenExp })); }catch(e){}
      offline = false;
      scheduleRefresh();
      if(booted){ setSync('busy'); sync(false); }
      else start();
    }
  });
}
function signIn(){ tokenClient.requestAccessToken({ prompt: '' }); }

var reauthAt = 0;
function reauth(){
  if(Date.now() - reauthAt < 4000) return;
  reauthAt = Date.now();
  try{ tokenClient.requestAccessToken({ prompt: '' }); }catch(e){ offline = true; setSync('err'); }
}

function scheduleRefresh(){
  clearTimeout(refreshTimer);
  var wait = tokenExp - Date.now() - REFRESH_MARGIN;
  if(wait < 30000) wait = 30000;
  refreshTimer = setTimeout(function(){
    /* en arriere-plan on ne peut pas renouveler, mais il ne faut surtout pas
       abandonner : sans nouvelle tentative le jeton expire et la reconnexion
       devient visible en pleine utilisation */
    if(document.hidden){ refreshTimer = setTimeout(scheduleRefresh, 45000); return; }
    reauth();
  }, wait);
}

function tokenValid(){ return !!token && Date.now() < tokenExp - 10000; }

function api(url, opts){
  opts = opts || {};
  opts.headers = opts.headers || {};
  opts.headers.Authorization = 'Bearer ' + token;
  return fetch(url, opts).then(function(r){
    if(r.status === 401){
      token = null;
      try{ localStorage.removeItem(LS + 'tk'); }catch(e){}
      reauth(); throw new Error('auth');
    }
    return r;
  }, function(err){
    offline = true; setSync('err');
    throw err;
  });
}

      .then(function(u){ me = u; })

}

  if(hadCache){ setSync('busy'); render(); }

    reauth();
  } else {
    scheduleRefresh();
    await sync(true);
  }

  /* Precharger le module Stock sans bloquer : la liste des extensions vient
     du cache du service worker, le stock du cache local puis de Drive.
     Quand l'utilisateur ouvre l'onglet, tout est deja pret. */
  stkPreload();

  setTimeout(checkUpdate, 4000);
  setInterval(checkUpdate, 10 * 60 * 1000);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') checkUpdate();
  });

  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(function(){
    if(sheetOpen || saving || document.hidden) return;
    if(tokenValid()) sync(false);
    else reauth();

/* fusion : un lot gagne s'il a le updatedAt le plus récent */
function mergeInto(map, arr){
  for(var i=0;i<arr.length;i++){
    var l = arr[i];
    if(!l || !l.id) continue;
    var prev = map[l.id];
    if(!prev || String(l.updatedAt||'') > String(prev.updatedAt||'')) map[l.id] = l;
  }
}

async function sync(full){
  if(saving) return;
  setSync('busy');
  try{
    var files = await listFiles();
    var map = {};
    myFileId = null;
    for(var i=0;i<files.length;i++){
      var f = files[i];
      if(f.name === myFile) myFileId = f.id;
      var rr = await api('https://www.googleapis.com/drive/v3/files/' + f.id + '?alt=media');
      var data = await rr.json().catch(function(){ return {}; });
      if(data && data.lots) mergeInto(map, data.lots);
      if(f.name === myFile && data){
        if(data.tagTpl) tagTpl = data.tagTpl;
        var own = data.lots || [];
        for(var z=0;z<own.length;z++){
          var cur = savedLots[own[z].id];
          if(!cur || String(own[z].updatedAt||'') > String(cur.updatedAt||'')) savedLots[own[z].id] = own[z];
        }
      }
    }
    var out = [];
    for(var k in map){ if(!map[k].deleted) out.push(map[k]); }
    out.sort(function(a,b){ return String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')); });
    lots = out;
    offline = false;
    saveCache();
    setSync('');
    render();
  }catch(e){
    if(e.message !== 'auth') setSync('err');
  }
}

var savedLots = {};
async function save(){
  if(saving){ dirty = true; return; }
  saving = true; setSync('busy');
  try{
    /* Relire le distant avant d'ecrire : l'app ecrit le fichier entier depuis
       sa memoire, et la synchro automatique est suspendue tant qu'un panneau
       est ouvert. Sans cette fusion, un enregistrement fait apres une longue
       saisie effacerait les lots crees entre-temps sur l'autre appareil. */
    if(myFileId){
      try{
        var rr0 = await api('https://www.googleapis.com/drive/v3/files/' + myFileId + '?alt=media');
        var rem0 = await rr0.json();
        var rl0 = (rem0 && rem0.lots) || [];
        for(var q0=0;q0<rl0.length;q0++){
          var cur0 = savedLots[rl0[q0].id];
          if(!cur0 || String(rl0[q0].updatedAt || '') > String(cur0.updatedAt || '')) savedLots[rl0[q0].id] = rl0[q0];
        }
      }catch(e0){ /* distant illisible : on ecrit ce qu'on a */ }
    }
    var body = { v: APP_VERSION, tagTpl: tagTpl, updated: now(), lots: [] };
    for(var k in savedLots) body.lots.push(savedLots[k]);
    var json = JSON.stringify(body);
    if(!myFileId){
      var m = await api('https://www.googleapis.com/drive/v3/files?fields=id', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ name: myFile, parents: ['appDataFolder'] })
      });
      myFileId = (await m.json()).id;
    }
    await api('https://www.googleapis.com/upload/drive/v3/files/' + myFileId + '?uploadType=media', {
      method:'PATCH', headers:{'Content-Type':'application/json'}, body: json
    });
    setSync('');
    makeBackup(false).catch(function(){});
  }catch(e){
    if(e.message !== 'auth') setSync('err');
  }
  saving = false;
  if(dirty){ dirty = false; save(); }
}

/* écrit un lot : dans mon fichier + dans la vue locale */
function commit(lot){
  lot.updatedAt = now();
  lot.by = who || 'moi';
  savedLots[lot.id] = lot;
  var i = -1;
  for(var j=0;j<lots.length;j++){ if(lots[j].id === lot.id){ i = j; break; } }
  if(lot.deleted){ if(i>=0) lots.splice(i,1); }
  else if(i>=0) lots[i] = lot;
  else lots.unshift(lot);
  render();
  saveCache();
  save();
}

/* ═══ PHOTOS ═══ */
function shrink(file){
  return new Promise(function(res){
    var img = new Image();
    img.onload = function(){
      var max = 900, w = img.width, h = img.height;
      if(w > h && w > max){ h = Math.round(h*max/w); w = max; }
      else if(h > max){ w = Math.round(w*max/h); h = max; }
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(function(b){ res(b); }, 'image/jpeg', 0.82);
    };
    img.onerror = function(){ res(null); };
    img.src = URL.createObjectURL(file);
  });
}
async function uploadPhoto(blob){
  var meta = { name: 'ph_' + nid() + '.jpg', parents: ['appDataFolder'] };
  var fd = new FormData();
  fd.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
  fd.append('file', blob);
  var r = await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method:'POST', body: fd });
  var j = await r.json();
  await idbPut(j.id, blob);
  return j.id;
}
var urlCache = {};
async function photoUrl(id){
  if(!id) return null;
  if(urlCache[id]) return urlCache[id];
  var b = await idbGet(id);
  if(!b){
    try{
      var r = await api('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media');
      b = await r.blob();
      await idbPut(id, b);
    }catch(e){ return null; }
  }
  urlCache[id] = URL.createObjectURL(b);
  return urlCache[id];
}
function hydratePhotos(){
  var els = document.querySelectorAll('[data-ph]');
  for(var i=0;i<els.length;i++){
    (function(el){
      var id = el.getAttribute('data-ph');
      el.removeAttribute('data-ph');
      photoUrl(id).then(function(u){
        if(!u) return;
        var img = document.createElement('img');
        img.src = u; img.alt = '';
        el.insertBefore(img, el.firstChild);
        el.classList.add('has');
      });
    })(els[i]);
  }
}

/* ═══ SELECTORS ═══ */
function byStatus(s){ return lots.filter(function(l){ return l.st === s; }); }
function query(){ return ($('q').value || '').trim(); }
function matches(l, q){
  var n = norm(q);
  if(!n) return true;
  return norm(l.nom).indexOf(n) >= 0 ||
         norm(l.poke).indexOf(n) >= 0 ||
         norm(l.boite).indexOf(n) >= 0 ||
         norm(l.sep).indexOf(n) >= 0 ||
         norm(l.notes).indexOf(n) >= 0 ||
         norm(l.acheteur).indexOf(n) >= 0;
}
/* nombre de cartes : valeur saisie pour les anciens lots,
   compte reel des cartes rattachees pour les nouveaux */
function lotNb(l){
  if(l && l.nb != null) return l.nb;
  var n = (typeof lotCardCount === 'function') ? lotCardCount(l) : 0;
  return n || null;
}
function lotTitle(l){
  if(l.nom) return l.nom;
  var p = l.poke || 'Lot';
  var n = lotNb(l);
  return n ? (p + ' — ' + n + ' cartes') : p;
}

async function listBackups(){
  var url = 'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&pageSize=100' +
    '&fields=files(id,name,size,createdTime)&orderBy=createdTime desc&q=' +
    encodeURIComponent("name contains '" + BAK_PREFIX + "' and trashed=false");
  var r = await api(url);
  var j = await r.json();
  return (j.files || []).map(function(f){
    var parts = f.name.replace(/\.json$/,'').split('_');
    return { id: f.id, name: f.name, who: parts[1] || '?', at: f.createdTime, size: parseInt(f.size || 0, 10) };
  });
}

async function makeBackup(force){
  if(!lots.length) return;
  var last = 0;
  try{ last = parseInt(localStorage.getItem(LS + 'lastbak') || '0', 10); }catch(e){}
  if(!force && Date.now() - last < BAK_EVERY) return;
  var body = JSON.stringify({ v: APP_VERSION, who: who, at: now(), count: lots.length, lots: lots });
  var meta = { name: BAK_PREFIX + who + '_' + Date.now() + '.json', parents: ['appDataFolder'] };
  var fd = new FormData();
  fd.append('metadata', new Blob([JSON.stringify(meta)], { type:'application/json' }));
  fd.append('file', new Blob([body], { type:'application/json' }));
  await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method:'POST', body: fd });
  try{ localStorage.setItem(LS + 'lastbak', String(Date.now())); }catch(e){}
  await pruneBackups();
}

async function pruneBackups(){
  var all = await listBackups();
  /* en compte unique on liste tout : masquer les anciennes sauvegardes
     de l'autre identite reviendrait a les rendre irrecuperables */
  var mine = SOLO ? all : all.filter(function(b){ return b.who === who; });
  for(var i=BAK_KEEP;i<mine.length;i++){
    try{ await api('https://www.googleapis.com/drive/v3/files/' + mine[i].id, { method:'DELETE' }); }catch(e){}
  }
}

async function restoreBackup(id){
  var r = await api('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media');
  var data = await r.json();
  if(!data || !data.lots) { toast('Sauvegarde illisible'); return; }
  var stamp = now();
  var seen = {};
  for(var i=0;i<data.lots.length;i++){
    var l = data.lots[i];
    if(!l || !l.id) continue;
    l.updatedAt = stamp; l.by = who; delete l.deleted;
    savedLots[l.id] = l;
    seen[l.id] = true;
  }
  for(var j=0;j<lots.length;j++){
    if(!seen[lots[j].id]){
      savedLots[lots[j].id] = { id: lots[j].id, deleted: true, updatedAt: stamp, by: who };
    }
  }
  await save();
  await sync(true);
  toast(data.lots.length + ' lots restaurés');
}

function download(name, text, type){
  var b = new Blob([text], { type: type || 'application/json' });
  var u = URL.createObjectURL(b);
  var a = document.createElement('a');
  a.href = u; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); }, 1500);
}

function csvCell(v){
  var s = String(v == null ? '' : v);
  return '"' + s.replace(/"/g,'""') + '"';
}
function exportCsv(){
  var sold = lots.filter(function(l){ return l.st === 'vendu' || l.st === 'expedie'; });
  sold.sort(function(a,b){ return String(a.dtVente||'').localeCompare(String(b.dtVente||'')); });
  var head = ['Date de vente','Pokemon','Titre','Nb cartes','Prix affiche','Prix mini','Prix vendu','Acheteur','Boite','Date mise en ligne','Jours en ligne'];
  var rows = [head.map(csvCell).join(';')];
  var tot = 0;
  for(var i=0;i<sold.length;i++){
    var l = sold[i];
    var jours = (l.dtListe && l.dtVente)
      ? Math.max(0, Math.round((new Date(l.dtVente) - new Date(l.dtListe)) / 86400000)) : '';
    tot += (num(l.pv) || 0);
    rows.push([dt(l.dtVente), l.poke, lotTitle(l), lotNb(l), l.pa, l.pm, l.pv, l.acheteur, l.boite, dt(l.dtListe), jours].map(csvCell).join(';'));
  }
  rows.push('');
  rows.push([csvCell('Total'),'','','','','',csvCell(tot.toFixed(2))].join(';'));

function sortLots(arr){
  var out = arr.slice();
  out.sort(function(a, b){
    var r = 0;
    if(sortKey === 'alpha'){
      r = lotTitle(a).localeCompare(lotTitle(b), 'fr', { sensitivity:'base' });
    } else if(sortKey === 'prix'){
      var pa = num(a.pa), pb = num(b.pa);
      if(pa == null && pb == null) r = 0;
      else if(pa == null) r = -1;
      else if(pb == null) r = 1;
      else r = pa - pb;
    } else {
      r = String(a.dtListe || a.dtCree || '').localeCompare(String(b.dtListe || b.dtCree || ''));
    }
    return r * sortDir;
  });
  return out;
}

function sortBar(){
  var arrows = { date: sortDir === -1 ? 'Récents d\'abord' : 'Anciens d\'abord',
                 alpha: sortDir === -1 ? 'Z → A' : 'A → Z',
                 prix: sortDir === -1 ? 'Prix décroissant' : 'Prix croissant' };
  var h2 = '<div class="sortBar">';
  for(var k in SORTS){
    var on = (k === sortKey);
    h2 += '<button class="sBtn' + (on ? ' on' : '') + '" data-sort="' + k + '">' + SORTS[k] +
      (on ? '<span class="ar">' + (sortDir === -1 ? '▼' : '▲') + '</span>' : '') + '</button>';
  }
  h2 += '</div>';
  return h2 + '<div class="hint" style="padding:0 0 8px;text-align:left;font-size:11px">' + arrows[sortKey] + '</div>';
}

function histoGroups(){
  var sold = lots.filter(function(l){ return l.st === 'vendu' || l.st === 'expedie'; });
  var byAch = groupBy === 'ach';
  var g = {};
  for(var i=0;i<sold.length;i++){
    var raw = byAch ? (sold[i].acheteur || '').trim() : (sold[i].poke || '').trim();
    var lbl = raw || (byAch ? 'Acheteur non renseigné' : '?');
    var key = norm(raw) || (byAch ? '_noach' : '_nopoke');
    if(!g[key]) g[key] = { key: key, nom: lbl, items: [] };
    g[key].items.push(sold[i]);
  }
  var keys = Object.keys(g), out = [];
  for(var k=0;k<keys.length;k++){
    var o = g[keys[k]];
    o.items.sort(function(a,b){ return String(b.dtVente||'').localeCompare(String(a.dtVente||'')); });
    var sum = 0, mx = 0, mn = null, last = '';
    for(var j2=0;j2<o.items.length;j2++){
      var pv = num(o.items[j2].pv) || 0;
      sum += pv;
      if(pv > mx) mx = pv;
      if(mn === null || (pv > 0 && pv < mn)) mn = pv;
      var dv = String(o.items[j2].dtVente || '');
      if(dv > last) last = dv;
    }
    o.sum = sum; o.max = mx; o.min = mn || 0;
    o.avg = o.items.length ? sum / o.items.length : 0;
    o.last = last;
    out.push(o);
  }
  out.sort(function(a,b){
    var r = 0;
    if(sortKey === 'alpha') r = a.nom.localeCompare(b.nom, 'fr', { sensitivity:'base' });
    else if(sortKey === 'prix') r = a.avg - b.avg;
    else r = String(a.last).localeCompare(String(b.last));
    return r * sortDir;
  });
  return out;
}

function groupToggle(){
  return '<div class="gToggle">' +
    '<button data-gb="poke"' + (groupBy === 'poke' ? ' class="on"' : '') + '>Par Pokémon</button>' +
    '<button data-gb="ach"' + (groupBy === 'ach' ? ' class="on"' : '') + '>Par acheteur</button></div>';
}

function renderHisto(){
  var groups = histoGroups();
  var q = query();
  if(!groups.length){ $('view').innerHTML = groupToggle() + empty(EMPTY_HISTO,'Aucune vente enregistrée.'); return; }
  if(q){
    groups = groups.filter(function(o){
      if(norm(o.nom).indexOf(norm(q)) >= 0) return true;
      for(var i=0;i<o.items.length;i++){ if(matches(o.items[i], q)) return true; }
      return false;
    });
    if(!groups.length){
      $('view').innerHTML = groupToggle() + sortBar(false) + noHit(EMPTY_HISTO, groupBy === 'ach' ? 'les acheteurs' : 'l\'historique des ventes');
      return;
    }
  }
  var total = 0, n = 0;
  for(var i=0;i<groups.length;i++){ total += groups[i].sum; n += groups[i].items.length; }
  var h2 = groupToggle() + sortBar(false) + '<div class="secH">Ventes <span>' + n + ' lots · ' + eur(total) + '</span></div>';
  for(var k=0;k<groups.length;k++){
    var o = groups[k];
    var rows = o.items.slice(0,3).map(function(l){
      var _n2 = lotNb(l);
      var quoi = groupBy === 'ach' ? esc(l.poke || '?') : (_n2 ? _n2 + ' cartes' : '');
      return '<div class="hRow"><span>' + dt(l.dtVente) + (quoi ? ' · ' + quoi : '') + '</span><b>' + eur(num(l.pv)) + '</b></div>';
    }).join('');
    var more = o.items.length > 3 ? '<div class="hRow" style="color:var(--red)"><span>Voir les ' + o.items.length + ' ventes</span><span>›</span></div>' : '';
    h2 += '<div class="hCard" data-histo="' + esc(o.key) + '"><div class="hTitle"><div class="hName">' + esc(o.nom) + '</div>' +
      '<div class="hCnt">' + o.items.length + (groupBy === 'ach' ? ' achat' : ' vendu') + (o.items.length>1?'s':'') + '</div></div>' +
      '<div class="hStats"><div>Moyenne<b>' + eur(o.avg) + '</b></div><div>Max<b>' + eur(o.max) + '</b></div><div>Min<b>' + eur(o.min) + '</b></div><div>Total<b>' + eur(o.sum) + '</b></div></div>' +
      '<div class="hList">' + rows + more + '</div></div>';
  }
  $('view').innerHTML = h2;
}

function selCount(){ var n = 0; for(var k in sel) if(sel[k]) n++; return n; }
function selIds(){ var o = []; for(var k in sel) if(sel[k]) o.push(k); return o; }

function enterSel(id){
  selMode = true; sel = {}; sel[id] = true;

  updateSelBar(); render();
}
function exitSel(){
  selMode = false; sel = {};
  $('selBar').classList.remove('on');

  render();
}
function toggleSel(id){
  var l = lots.filter(function(x){ return x.id === id; })[0];
  if(!l || l.st !== 'vitrine') return;
  if(sel[id]) delete sel[id]; else sel[id] = true;
  if(!selCount()){ exitSel(); return; }
  updateSelBar(); render();
}
function updateSelBar(){
  var n = selCount(), tot = 0;
  var ids = selIds();
  for(var i=0;i<ids.length;i++){
    var l = lots.filter(function(x){ return x.id === ids[i]; })[0];
    if(l) tot += (num(l.pa) || 0);
  }
  $('selBar').classList.toggle('on', selMode && n > 0);
  $('selHint').parentNode.innerHTML = '<b>' + n + ' lot' + (n>1?'s':'') + ' sélectionné' + (n>1?'s':'') + '</b>' +
    '<span id="selHint">' + (tot > 0 ? 'total affiché ' + eur(tot) : 'touche les autres lots') + '</span>';

function sheetMultiSell(){
  var ids = selIds();
  var items = [];
  for(var i=0;i<ids.length;i++){
    var l = lots.filter(function(x){ return x.id === ids[i]; })[0];
    if(l) items.push(l);
  }

  var rows = items.map(function(l){
    return '<div class="msRow"><div class="msNm">' + esc(lotTitle(l)) +

    '<input class="inp" id="ms_ach" placeholder="pseudo Vinted" autocomplete="off"></div>' +
    '<div class="shF"><button class="bS" id="msx">Annuler</button>' +
    '<button class="bP g" id="msk">Enregistrer la commande</button></div>');
  function recalc(){
    var t = 0, ins = document.querySelectorAll('[data-ms]');
    for(var j=0;j<ins.length;j++) t += (parseFloat(ins[j].value) || 0);
    $('msTot').textContent = eur(t);
  }
  var ins = document.querySelectorAll('[data-ms]');
  for(var j=0;j<ins.length;j++) ins[j].oninput = recalc;
  recalc();
  $('msx').onclick = closeSheet;
  $('msk').onclick = function(){
    var cmdId = nid(), stamp = now();
    var ach = $('ms_ach').value.trim();
    var all = document.querySelectorAll('[data-ms]');
    for(var k=0;k<all.length;k++){
      var id = all[k].getAttribute('data-ms');
      var lot = lots.filter(function(x){ return x.id === id; })[0];
      if(!lot) continue;
      lot.pv = num(all[k].value);
      lot.st = 'vendu'; lot.dtVente = stamp; lot.cmdId = cmdId;
      if(ach) lot.acheteur = ach;
      commit(lot);
    }
    closeSheet(); exitSel();
    toast('Commande enregistrée');
  };
}

/* Liste des cartes d'un lot, en lecture seule.
   Volontairement sans boutons : la fiche sert a consulter et a preparer
   l'expedition, un appui de travers ne doit pas modifier le stock. */
async function roCardsFill(l){
  var m = lotCards(l), keys = Object.keys(m);
  var box = document.getElementById('roCards');
  if(!box || !keys.length) return;

  box.innerHTML = '<div class="pkH">Cartes du lot (' + lotCardCount(l) + ')</div>' +
                  '<div class="roCards"><div class="pkE">Chargement…</div></div>';
  if(!cdb){ try{ await cdbLoad(); }catch(e){} }
  try{ await ensureCards(keys); }catch(e){}
  box = document.getElementById('roCards');
  if(!box) return;

  keys.sort();
  var h = '', txt = [];
  for(var i=0;i<keys.length;i++){
    var k = keys[i], p = k.split('|'), c = cdbById[p[0]];
    var vs = c ? stkVars(c) : [p[1]];
    var det = [];
    if(vs.length > 1 && VAR_FULL[p[1]]) det.push(VAR_FULL[p[1]]);
    if(p[2] !== 'nm') det.push(ET_LBL[p[2]] || p[2]);
    var si = c ? setInfo(rootSet(c.s)) : null;
    var sub = (c ? 'N° ' + c.u : '') + (si ? ' · ' + si.name : '') + (det.length ? ' · ' + det.join(' ') : '');

    h += '<div class="roC">' + (c ? cardImg(c, '') : '') +
         '<span class="rn"><b>' + esc(c ? c.n : p[0]) + '</b><small>' + esc(sub) + '</small></span>' +
         '<span class="rx">×' + m[k] + '</span></div>';
    txt.push((m[k] > 1 ? m[k] + 'x ' : '') + (c ? c.n : p[0]) +
             (c ? ' (' + (si ? si.name + ' ' : '') + 'n°' + c.u + ')' : '') +
             (det.length ? ' - ' + det.join(' ') : ''));
  }
  box.innerHTML = '<div class="pkH">Cartes du lot (' + lotCardCount(l) + ')</div>' +
                  '<div class="roCards">' + h + '</div>' +
                  '<button class="roCopy" id="roCp">Copier la liste</button>';

  var b = document.getElementById('roCp');
  if(b) b.onclick = function(){
    var s = txt.join('\n');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(s).then(function(){ toast('Liste copiée'); })
        .catch(function(){ roCopyFallback(s); });
    } else roCopyFallback(s);
  };
}
/* repli pour les contextes ou l'API presse-papiers est refusee */
function roCopyFallback(s){
  var t = document.createElement('textarea');
  t.value = s;
  t.style.position = 'fixed';
  t.style.opacity = '0';
  document.body.appendChild(t);
  t.select();
  try{ document.execCommand('copy'); toast('Liste copiée'); }
  catch(e){ toast('Copie impossible'); }
  t.remove();
}

function sheetView(id){
  var l = lots.filter(function(x){ return x.id === id; })[0];
  if(!l) return;
  function row(k, v){
    if(v == null || v === '') return '';
    return '<div class="roRow"><i>' + k + '</i><b>' + v + '</b></div>';
  }
  var jours = (l.dtListe && l.dtVente)
    ? Math.max(0, Math.round((new Date(l.dtVente) - new Date(l.dtListe)) / 86400000)) : null;
  var ph = l.photo
    ? '<div class="fld"><div class="roPh" id="roPh" data-ph="' + l.photo + '"><span class="ph-holder" style="width:34px;height:34px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%;display:block"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/> <path d="M12 22V12"/> <polyline points="3.29 7 12 12 20.71 7"/> <path d="m7.5 4.27 9 5.15"/></svg></span></div></div>'
    : '';
  var rows =
    row('Pokémon', esc(l.poke)) +
    row('Nombre de cartes', lotNb(l)) +
    row('Statut', ST[l.st]) +
    row('Prix affiché', num(l.pa) != null ? eur(num(l.pa)) : '') +
    row('Prix mini accepté', num(l.pm) != null ? eur(num(l.pm)) : '') +
    row('Prix de vente', num(l.pv) != null ? '<span style="color:var(--grn)">' + eur(num(l.pv)) + '</span>' : '') +
    row('Acheteur', esc(l.acheteur)) +
    row('Mis en ligne le', l.dtListe ? dt(l.dtListe) : '') +
    row('Vendu le', l.dtVente ? dt(l.dtVente) : '') +
    row('Expédié le', l.dtExp ? dt(l.dtExp) : '') +
    row('Durée en ligne', jours != null ? (jours === 0 ? 'moins d’un jour' : jours + ' jour' + (jours>1?'s':'')) : '') +
    row('Notes', esc(l.notes));
  openSheet('<div class="shT">' + esc(lotTitle(l)) + '</div>' + ph +
    '<div class="fld">' + rows + '</div>' +
    '<div id="roCards"></div>' +
    '<div class="shF"><button class="bS" id="rox">Fermer</button>' +
    '<button class="bP" id="roe">Modifier</button></div>');
  roCardsFill(l);
  $('rox').onclick = closeSheet;
  $('roe').onclick = function(){ closeSheet(); setTimeout(function(){ sheetEdit(id); }, 260); };
  var pz = $('roPh');
  if(pz) pz.onclick = function(){
    var img = pz.querySelector('img');
    if(img) showLightbox(img.src);
  };
  hydratePhotos();
}

function sheetHistoPoke(key){
  var g = histoGroups();
  var o = null;
  for(var i=0;i<g.length;i++){ if(g[i].key === key){ o = g[i]; break; } }
  if(!o) return;
  var rows = o.items.map(function(l){ return histoRow(l, groupBy === 'poke'); }).join('');
  openSheet('<div class="shT">' + esc(o.nom) + '</div>' +
    '<div class="shS">' + o.items.length + ' vente' + (o.items.length>1?'s':'') +
    ' · total ' + eur(o.sum) + ' · moyenne ' + eur(o.avg) + '</div>' +
    '<div class="hvList">' + rows + '</div>' +
    '<div class="shF"><button class="bS" style="flex:1" id="hvc">Fermer</button></div>');
  $('hvc').onclick = closeSheet;
  bindHistoRows();
}

function sheetQuick(){
  var added = 0;
  openSheet(
    '<div class="shT">Lots à préparer</div>' +
    '<div class="shS">Tape un Pokémon, valide, recommence. Les détails se complètent plus tard en touchant le lot.</div>' +
    '<div class="fld"><label class="lbl">Pokémon</label><input class="inp" id="q_poke" placeholder="Évoli" enterkeyhint="done"' + noAuto() + '></div>' +
    '<div id="q_list"></div>' +
    '<div class="shF"><button class="bS" id="qx">Terminé</button><button class="bP" id="qk">Ajouter</button></div>' +
    '<button class="dgr" id="qf" style="border-color:var(--bd);color:var(--tx2)">Saisie complète avec prix et photo</button>'
  );
  clearInputs(['q_poke']);
  var inp = $('q_poke');
  function add(){
    var poke = inp.value.trim();
    if(!poke){ inp.focus(); return; }
    var l = {
      id: nid(), poke: poke, nom: '', nb: null, boite: '', sep: '',
      st: 'afaire', pa: null, pm: null, pv: null,
      acheteur: '', notes: '', photo: null,
      dtCree: now(), dtPret: null, dtListe: null, dtVente: null, dtExp: null
    };
    commit(l);
    added++;
    var box = $('q_list');
    if(box) box.innerHTML = '<div class="hint">' + added + ' lot' + (added>1?'s':'') + ' ajouté' + (added>1?'s':'') + ' à la liste</div>';
    inp.value = ''; inp.focus();
  }
  $('qk').onclick = add;
  inp.onkeydown = function(e){ if(e.key === 'Enter'){ e.preventDefault(); add(); } };
  $('qx').onclick = closeSheet;
  $('qf').onclick = function(){ closeSheet(); setTimeout(function(){ sheetNew('afaire'); }, 260); };
  setTimeout(function(){ inp.focus(); }, 120);
}

function showHistoHint(poke){
  var box = $('histoHint');
  if(!box) return;
  if(!poke){ box.innerHTML = ''; return; }
  var past = lots.filter(function(x){
    return (x.st === 'vendu' || x.st === 'expedie') &&
      norm(x.poke) === norm(poke) && num(x.pv) != null;
  });
  if(!past.length){ box.innerHTML = ''; return; }
  var s = 0;
  for(var i=0;i<past.length;i++) s += num(past[i].pv);
  box.innerHTML = '<div class="hint">Historique ' + esc(poke) + ' : ' + past.length + ' vente' +
    (past.length>1?'s':'') + ', moyenne <b style="color:var(--grn)">' + eur(s/past.length) + '</b></div>';
}

async function createLot(mode, btnId){
  var poke = $('f_poke').value.trim();
  if(!poke){ toast('Le Pokémon est requis'); return; }
  var btn = $(btnId) || $('k1');
  btn.disabled = true; btn.textContent = '…';
  var photoId = null;
  if(pendingPhoto && pendingPhoto !== 'none'){
    try{ photoId = await uploadPhoto(pendingPhoto); }catch(e){}
  }
  var l = {
    id: nid(), poke: poke,
    nom: '',
    nb: parseInt($('f_nb').value, 10) || null, cards: {},
    boite: '', sep: '',
    st: mode, pa: num($('f_pa').value), pm: num($('f_pm').value), pv: null,
    acheteur: '', notes: '', photo: photoId,
    dtCree: now(), dtPret: null, dtListe: null, dtVente: null, dtExp: null
  };
  var dl = $('f_dl') ? fromDateInput($('f_dl').value) : null;
  if(dl){ l.st = 'vitrine'; l.dtListe = dl; l.dtPret = dl; }
  else if(mode === 'vitrine'){ l.dtListe = now(); l.dtPret = now(); }
  closeSheet();
  commit(l);
  toast(mode === 'vitrine' ? 'Lot en vitrine' : 'Lot à préparer');
  /* un nombre saisi a la main signifie qu'on ne detaille pas les cartes :
     inutile d'imposer le selecteur. Champ vide = on veut les choisir. */
  if(l.nb == null) setTimeout(function(){ sheetPick(l.id); }, 280);
}

/* étape 2 : mise en ligne — prix + photo */
function sheetList(id){
  var l = lots.filter(function(x){ return x.id === id; })[0];
  if(!l) return;
  pendingPhoto = null;
  var past = lots.filter(function(x){
    return x.id !== id && (x.st === 'vendu' || x.st === 'expedie') &&
      norm(x.poke) === norm(l.poke) && num(x.pv) != null;
  });
  var hint = '';
  if(past.length){
    var s = 0;
    for(var i=0;i<past.length;i++) s += num(past[i].pv);
    hint = '<div class="hint">Historique ' + esc(l.poke) + ' : ' + past.length + ' vente' + (past.length>1?'s':'') +
      ', moyenne <b style="color:var(--grn)">' + eur(s/past.length) + '</b></div>';
  }
  openSheet(
    '<div class="shT">Mettre en ligne</div>' +
    '<div class="shS">' + esc(lotTitle(l)) + '</div>' +
    '<div class="fld"><label class="lbl">Photo de l\'annonce</label>' + photoZone(l) + '</div>' +
    '<div class="fld"><label class="lbl">Titre de l\'annonce (optionnel)</label><input class="inp" id="f_nom" value="' + esc(l.nom) + '" placeholder="' + esc(lotTitle(l)) + '"></div>' +
    '<div class="row2"><div class="fld"><label class="lbl">Prix affiché</label><input class="inp" id="f_pa" type="number" inputmode="decimal" step="0.5" value="' + (l.pa==null?'':l.pa) + '" placeholder="12"></div>' +
    '<div class="fld"><label class="lbl">Prix mini accepté</label><input class="inp" id="f_pm" type="number" inputmode="decimal" step="0.5" value="' + (l.pm==null?'':l.pm) + '" placeholder="9"></div></div>' +
    '<div class="fld"><label class="lbl">En ligne depuis le</label><input class="inp" id="f_dl" type="date" value="' + toDateInput(l.dtListe || now()) + '" max="' + toDateInput(now()) + '"></div>' +
    hint +
    '<div class="shF"><button class="bS" id="x2">Annuler</button><button class="bP" id="k2">Mettre en vitrine</button></div>' +
    '<button class="dgr" id="k2b" style="border-color:var(--bd);color:var(--tx2)">Copier les hashtags</button>'
  );
  bindPhoto();
  $('x2').onclick = closeSheet;
  $('k2b').onclick = function(){ copyTags(l); };
  $('k2').onclick = async function(){
    $('k2').textContent = '…'; $('k2').disabled = true;
    if(pendingPhoto){ try{ l.photo = await uploadPhoto(pendingPhoto); }catch(e){} }
    l.nom = $('f_nom').value.trim();
    l.pa = num($('f_pa').value); l.pm = num($('f_pm').value);
    l.st = 'vitrine'; l.dtListe = fromDateInput($('f_dl').value) || now();
    if(!l.dtPret) l.dtPret = now();
    closeSheet(); commit(l); toast('En vitrine');
  };
}

/* vente */
function sheetSell(id){
  var l = lots.filter(function(x){ return x.id === id; })[0];
  if(!l) return;
  var buyers = {};
  for(var i=0;i<lots.length;i++){ if(lots[i].st === 'vendu' && lots[i].acheteur) buyers[lots[i].acheteur] = 1; }
  var bl = Object.keys(buyers);
  var quick = bl.length
    ? '<div class="fld"><label class="lbl">Commandes en cours</label><div class="chips">' +
      bl.map(function(b){ return '<button class="aBtn p" data-buyer="' + esc(b) + '">' + esc(b) + '</button>'; }).join('') +
      '</div></div>'
    : '';
  openSheet(
    '<div class="shT">Lot vendu</div>' +
    '<div class="shS">' + esc(lotTitle(l)) + (num(l.pa)!=null ? ' · affiché ' + eur(num(l.pa)) : '') + '</div>' +
    '<div class="fld"><label class="lbl">Prix de vente réel</label><input class="inp" id="f_pv" type="number" inputmode="decimal" step="0.5" value="' + (l.pa==null?'':l.pa) + '"></div>' +
    '<div class="fld"><label class="lbl">Acheteur — pseudo Vinted</label><input class="inp" id="f_ach" placeholder="pseudo Vinted" autocomplete="off" value="' + esc(l.acheteur) + '"></div>' +
    quick +
    '<div class="shF"><button class="bS" id="x3">Annuler</button><button class="bP g" id="k3">Enregistrer la vente</button></div>'
  );
  $('x3').onclick = closeSheet;
  var qb = document.querySelectorAll('[data-buyer]');
  for(var b=0;b<qb.length;b++){
    qb[b].onclick = function(){ $('f_ach').value = this.getAttribute('data-buyer'); };
  }
  $('k3').onclick = function(){
    var pv = num($('f_pv').value);
    if(pv == null){ toast('Indique le prix de vente'); return; }
    l.pv = pv; l.acheteur = $('f_ach').value.trim();
    l.st = 'vendu'; l.dtVente = now();
    closeSheet(); commit(l); toast('Vente enregistrée');
  };
  setTimeout(function(){ $('f_pv').focus(); $('f_pv').select(); }, 120);
}

/* édition complète */
function sheetEdit(id){
  var l = lots.filter(function(x){ return x.id === id; })[0];
  if(!l) return;
  pendingPhoto = null;
  openSheet(
    '<div class="shT">Modifier</div>' +
    '<div class="fld"><label class="lbl">Photo</label>' + photoZone(l) + '</div>' +
    '<div class="fld"><label class="lbl">Titre de l\'annonce</label><input class="inp" id="f_nom" value="' + esc(l.nom) + '" placeholder="' + esc(lotTitle(l)) + '"></div>' +
    '<div class="row2"><div class="fld"><label class="lbl">Pokémon</label><input class="inp" id="f_poke" value="' + esc(l.poke) + '"></div>' +
    '<div class="fld"><label class="lbl">Nb cartes</label><input class="inp" id="f_nb" type="number" inputmode="numeric" value="' + (l.nb==null?'':l.nb) + '" placeholder="vide = compté"></div></div>' +
    '<div class="row2"><div class="fld"><label class="lbl">Prix affiché</label><input class="inp" id="f_pa" type="number" inputmode="decimal" step="0.5" value="' + (l.pa==null?'':l.pa) + '"></div>' +
    '<div class="fld"><label class="lbl">Prix mini accepté</label><input class="inp" id="f_pm" type="number" inputmode="decimal" step="0.5" value="' + (l.pm==null?'':l.pm) + '"></div></div>' +
    (num(l.pv) != null ? '<div class="fld"><label class="lbl">Prix de vente réel</label><input class="inp" id="f_pv" type="number" inputmode="decimal" step="0.5" value="' + l.pv + '"></div>' : '') +
    '<div class="row2"><div class="fld"><label class="lbl">Statut</label><select class="inp" id="f_st">' +
      opt('afaire', l.st) + opt('pret', l.st) + opt('vitrine', l.st) + opt('vendu', l.st) + opt('expedie', l.st) +
    '</select></div>' +
    '<div class="fld"><label class="lbl">Acheteur</label><input class="inp" id="f_ach" value="' + esc(l.acheteur) + '"></div></div>' +
    '<div class="row2"><div class="fld"><label class="lbl">En ligne depuis le</label><input class="inp" id="f_dl" type="date" value="' + toDateInput(l.dtListe) + '" max="' + toDateInput(now()) + '"></div>' +
    '<div class="fld"><label class="lbl">Date de vente</label><input class="inp" id="f_dv" type="date" value="' + toDateInput(l.dtVente) + '" max="' + toDateInput(now()) + '"></div></div>' +
    '<div class="fld"><label class="lbl">Notes</label><textarea class="inp" id="f_notes" placeholder="Contenu, état, remarques…">' + esc(l.notes) + '</textarea></div>' +
    '<div class="shF"><button class="bS" id="x4">Annuler</button><button class="bP" id="k4">Enregistrer</button></div>' +
    '<button class="dgr" id="k4t" style="border-color:var(--bd);color:var(--tx2)">Copier les hashtags</button>' +
    '<button class="dgr" id="k4d">Supprimer ce lot</button>'
  );
  bindPhoto();
  $('x4').onclick = closeSheet;
  $('k4t').onclick = function(){ copyTags(l); };
  $('k4d').onclick = function(){
    var nbk = lotCardCount(l);
    var parti = (l.st === 'vendu' || l.st === 'expedie');   /* deja vendu : les cartes sont parties */
    var txt = lotTitle(l) + ' sera retiré pour toi et pour ' + (who === 'thomas' ? 'Cindy' : 'Thomas') + '.';
    if(nbk) txt += parti
      ? ' Ses ' + nbk + ' carte(s) resteront déduites du stock, puisque le lot a été vendu.'
      : ' Ses ' + nbk + ' carte(s) seront recréditées dans ton stock.';
    confirmBox('Supprimer ce lot ?', txt, 'Supprimer', function(){
      if(nbk && !parti) lotRestore(l);
      l.deleted = true; closeSheet(); commit(l);
      toast(nbk && !parti ? 'Lot supprimé, ' + nbk + ' carte(s) remise(s) en stock' : 'Lot supprimé');
    });
  };
  $('k4').onclick = async function(){
    $('k4').textContent = '…'; $('k4').disabled = true;
    if(pendingPhoto){ try{ l.photo = await uploadPhoto(pendingPhoto); }catch(e){} }
    if(pendingPhoto === 'none') l.photo = null;
    l.nom = $('f_nom').value.trim();
    l.poke = $('f_poke').value.trim();
    l.nb = parseInt($('f_nb').value,10) || null;
    l.pa = num($('f_pa').value); l.pm = num($('f_pm').value);
    if($('f_pv')) l.pv = num($('f_pv').value);
    l.acheteur = $('f_ach').value.trim();
    l.notes = $('f_notes').value.trim();
    var dl2 = fromDateInput($('f_dl').value);
    if(dl2 || $('f_dl').value === '') l.dtListe = dl2;
    var dv2 = fromDateInput($('f_dv').value);
    if(dv2 || $('f_dv').value === '') l.dtVente = dv2;
    var ns = $('f_st').value;
    if(ns !== l.st){
      l.st = ns;
      if(ns === 'vitrine' && !l.dtListe) l.dtListe = now();
      if(ns === 'vendu' && !l.dtVente) l.dtVente = now();
      if(ns === 'expedie' && !l.dtExp) l.dtExp = now();
    }
    var needSell = (l.st === 'vendu' || l.st === 'expedie') && num(l.pv) == null;
    closeSheet(); commit(l);
    if(needSell){ setTimeout(function(){ sheetSell(l.id); }, 260); }
    else toast('Enregistré');
  };
}
function opt(v, cur){ return '<option value="' + v + '"' + (v === cur ? ' selected' : '') + '>' + ST[v] + '</option>'; }

function photoZone(l){
  var holder = '<span class="ph-holder" style="font-size:13px">Ajouter la photo Vinted</span>';

    '<button class="phE" type="button" id="phE" aria-label="Remplacer la photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%;display:block"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/> <path d="m15 5 4 4"/></svg></button>' +

function bindPhoto(){
  var z = $('phZ');
  if(!z) return;
  var inp = $('f_ph');
  if(inp){
    inp.onchange = async function(){
      var f = inp.files[0]; if(!f) return;
      var b = await shrink(f); if(!b) return;
      pendingPhoto = b;
      var old = z.querySelector('img');
      if(old) old.remove();
      var img = document.createElement('img');
      img.src = URL.createObjectURL(b); img.alt = '';
      z.insertBefore(img, z.firstChild);
      z.classList.add('has');
    };
  }
  var e2 = $('phE');
  if(e2) e2.onclick = function(ev){
    ev.stopPropagation(); ev.preventDefault();
    if(inp) inp.click();
  };
  var x = $('phX');
  if(x) x.onclick = function(ev){
    ev.stopPropagation(); ev.preventDefault();
    confirmBox('Retirer la photo ?', 'Elle sera détachée du lot à l\'enregistrement.', 'Retirer', function(){
      pendingPhoto = 'none';
      var old = z.querySelector('img');
      if(old) old.remove();
      z.classList.remove('has');
    });
  };
  z.onclick = function(ev){
    if(ev.target === e2 || ev.target === x || (e2 && e2.contains(ev.target)) || (x && x.contains(ev.target))) return;
    var img = z.querySelector('img');
    if(img) showLightbox(img.src);
  };
  hydratePhotos();
}

/* refaire un lot */
function sheetAgain(id){
  var src = lots.filter(function(x){ return x.id === id; })[0];
  if(!src) return;
  var past = lots.filter(function(x){
    return (x.st === 'vendu' || x.st === 'expedie') &&
      norm(x.poke) === norm(src.poke) && num(x.pv) != null;
  });
  var s = 0;
  for(var i=0;i<past.length;i++) s += num(past[i].pv);
  var hint = past.length
    ? '<div class="hint">' + past.length + ' vente' + (past.length>1?'s':'') + ' de ' + esc(src.poke) + ' · moyenne <b style="color:var(--grn)">' + eur(s/past.length) + '</b> · dernier ' + eur(num(past[0].pv)) + '</div>'
    : '';
  openSheet(
    '<div class="shT">Refaire un lot ' + esc(src.poke) + '</div>' +
    '<div class="shS">Nouveau lot à préparer. Ajuste le nombre de cartes.</div>' +
    '<div class="row2"><div class="fld"><label class="lbl">Nombre de cartes</label><input class="inp" id="f_nb" type="number" inputmode="numeric" value="' + (src.nb==null?'':src.nb) + '"></div>' +
    hint +
    '<div class="shF"><button class="bS" id="x5">Annuler</button><button class="bP" id="k5">Ajouter à préparer</button></div>'
  );
  $('x5').onclick = closeSheet;
  $('k5').onclick = function(){
    var l = {
      id: nid(), poke: src.poke, nom: '',
      nb: parseInt($('f_nb').value,10) || null,
      boite: '', sep: '',
      st: 'afaire', pa: src.pa, pm: src.pm, pv: null,
      acheteur: '', notes: '', photo: null,
      dtCree: now(), dtPret: null, dtListe: null, dtVente: null, dtExp: null
    };
    closeSheet(); commit(l); toast('Nouveau lot à préparer');
  };
}

/* hashtags */
function buildTags(l){
  var p = (l && l.poke) ? l.poke.toLowerCase().replace(/[^a-z0-9àâäéèêëïîôöùûüç]/gi,'') : 'pokemon';
  return tagTpl.replace(/\{poke\}/g, p);
}
function copyTags(l){
  var t = buildTags(l);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ toast('Hashtags copiés'); },
      function(){ fallbackCopy(t); });
  } else fallbackCopy(t);
}
function fallbackCopy(t){
  var ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Hashtags copiés'); }catch(e){ toast('Copie impossible'); }
  document.body.removeChild(ta);
}

async function sheetRestore(){
  openSheet('<div class="shT">Restaurer une sauvegarde</div>' +
    '<div class="shS">Chargement…</div>');
  var list = [];
  try{ list = await listBackups(); }catch(e){}
  var rows = '';
  if(!list.length){
    rows = '<div class="hint">Aucune sauvegarde pour l\'instant. Elles se créent automatiquement toutes les 6 heures dès que tu modifies un lot.</div>';
  }
  for(var i=0;i<list.length;i++){
    var b = list[i];
    var d = new Date(b.at);
    var quand = d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'}) + ' à ' +
      d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    rows += '<button class="bakRow" data-bak="' + b.id + '" data-when="' + esc(quand) + '">' + quand +
      '<span class="n">' + esc(WHOS[b.who] || b.who) + '</span></button>';
  }

    '<div class="shS">La restauration remplace l\'ensemble des lots par ceux de la sauvegarde choisie, pour toi comme pour l\'autre appareil.</div>' +
    rows +
    '<div class="shF"><button class="bS" style="flex:1" id="rsx">Fermer</button></div>');
  $('rsx').onclick = closeSheet;
  var bs = document.querySelectorAll('[data-bak]');
  for(var j=0;j<bs.length;j++){
    bs[j].onclick = function(){
      var id = this.getAttribute('data-bak'), quand = this.getAttribute('data-when');
      confirmBox('Restaurer cette sauvegarde ?', 'État du ' + quand + '. Les lots créés depuis seront supprimés.', 'Restaurer', async function(){
        closeSheet();
        toast('Restauration…');
        try{ await restoreBackup(id); }catch(e){ toast('Échec de la restauration'); }
      });
    };
  }
}

document.addEventListener('contextmenu', function(e){
  var t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  e.preventDefault();
});
document.addEventListener('selectstart', function(e){
  var t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  e.preventDefault();
});

document.addEventListener('touchstart', function(e){
  var b = e.target.closest('[data-sell]');
  if(!b || selMode) return;
  e.preventDefault();
  var t = e.touches[0];
  lpId = b.getAttribute('data-sell');
  lpX = t.clientX; lpY = t.clientY; lpFired = false;
  clearTimeout(lpTimer);
  lpTimer = setTimeout(function(){
    lpFired = true; lpTimer = null;
    if(navigator.vibrate) navigator.vibrate(18);
    enterSel(lpId);
  }, 420);
}, { passive:false });

document.addEventListener('touchmove', function(e){
  if(lpTimer === null && !lpFired) return;
  var t = e.touches[0];
  if(!t) return;
  if(Math.abs(t.clientX - lpX) > 14 || Math.abs(t.clientY - lpY) > 14){
    clearTimeout(lpTimer); lpTimer = null;
  }
}, { passive:true });

document.addEventListener('touchend', function(e){
  if(!lpId) return;
  var fired = lpFired, id = lpId;
  clearTimeout(lpTimer); lpTimer = null; lpId = null; lpFired = false;
  e.preventDefault();
  suppressClick = true;
  setTimeout(function(){ suppressClick = false; }, 400);
  if(fired) return;
  if(selMode) toggleSel(id);
  else sheetSell(id);
}, { passive:false });

document.addEventListener('touchcancel', function(){
  clearTimeout(lpTimer); lpTimer = null; lpId = null; lpFired = false;
});

document.addEventListener('click', function(e){
  if(suppressClick){ suppressClick = false; e.preventDefault(); e.stopPropagation(); return; }
  if(selMode){
    var c = e.target.closest('.card');
    if(c){ e.preventDefault(); e.stopPropagation(); toggleSel(c.getAttribute('data-open')); }
    return;
  }
  var gb = e.target.closest('[data-gb]');
  if(gb){
    var v2 = gb.getAttribute('data-gb');
    if(v2 !== groupBy){
      groupBy = v2;
      try{ localStorage.setItem(LS + 'group', v2); }catch(err){}
      render();
    }
    return;
  }
  var hg = e.target.closest('[data-histo]');
  if(hg && !e.target.closest('[data-hedit],[data-hdel]')){ sheetHistoPoke(hg.getAttribute('data-histo')); return; }
  var s = e.target.closest('[data-sort]');
  if(s){
    var k = s.getAttribute('data-sort');
    if(k === sortKey) sortDir = -sortDir;
    else { sortKey = k; sortDir = (k === 'alpha') ? 1 : -1; }
    try{ localStorage.setItem(LS + 'sort', JSON.stringify({ k: sortKey, d: sortDir })); }catch(err){}
    render();
    return;
  }
  var t = e.target.closest('[data-open],[data-mv],[data-list],[data-sell],[data-again],[data-tag],[data-pk]');
  if(!t) return;
  var v;
  if((v = t.getAttribute('data-open'))){ sheetEdit(v); return; }
  if((v = t.getAttribute('data-list'))){ sheetList(v); return; }
  if((v = t.getAttribute('data-sell'))){ sheetSell(v); return; }
  if((v = t.getAttribute('data-again'))){ sheetAgain(v); return; }
  if((v = t.getAttribute('data-pk'))){ sheetPick(v); return; }
  if((v = t.getAttribute('data-tag'))){
    var lt = lots.filter(function(x){ return x.id === v; })[0];
    if(lt) copyTags(lt);
    return;
  }
  if((v = t.getAttribute('data-mv'))){
    var p = v.split('|'), l = lots.filter(function(x){ return x.id === p[0]; })[0];
    if(!l) return;
    l.st = p[1];
    if(p[1] === 'pret') l.dtPret = now();
    if(p[1] === 'expedie') l.dtExp = now();
    commit(l);
    toast(p[1] === 'pret' ? 'Lot prêt' : 'Marqué expédié');
    return;
  }
});

/* ═══ BOOT ═══ */
window.addEventListener('load', function(){
  var s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.onload = function(){
    initGis();
    var st = null;
    try{ st = JSON.parse(localStorage.getItem(LS + 'tk') || 'null'); }catch(e){}
    if(st && st.t && st.e > Date.now() + 60000){
      token = st.t; tokenExp = st.e;
      start();
      return;
    }
    var w = SOLO;
    if(!w){ try{ w = localStorage.getItem(LS + 'who'); }catch(e){} }
    if(w && WHOS[w]){
      start();
      setTimeout(reauth, 150);
    }
  };
  document.head.appendChild(s);
  if('serviceWorker' in navigator){
    /* un nouveau service worker prend la main : recharger une fois pour afficher
       la nouvelle version. hadCtrl evite de recharger a la toute premiere visite,
       ou clients.claim() declenche aussi cet evenement. */
    var hadCtrl = !!navigator.serviceWorker.controller, swReloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(!hadCtrl || swReloaded || sheetOpen) return;
      swReloaded = true;
      location.reload();
    });
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(function(reg){
      /* un service worker deja installe mais bloque en attente ne prendrait
         la main qu'apres fermeture complete de l'app : on le debloque */
      function pousser(){ if(reg.waiting) reg.waiting.postMessage('skipWaiting'); }
      pousser();
      reg.addEventListener('updatefound', function(){
        var sw = reg.installing;
        if(sw) sw.addEventListener('statechange', pousser);
      });
      reg.update();
      document.addEventListener('visibilitychange', function(){
        if(document.visibilityState === 'visible'){ reg.update(); pousser(); }
      });
    }).catch(function(){});
  }
});
