<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00071a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PoKoalaShop">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@800;900&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>PoKoalaShop</title>
<style>
:root{
--bg:#00071a;--surf:#0b1430;--surf2:#152045;--surf3:#202c58;
--red:#E3350D;--redS:rgba(227,53,13,.16);
--yel:#FFCB05;--yelS:rgba(255,203,5,.14);
--gold:#F0D890;
--grn:#4ECB8D;--grnS:rgba(78,203,141,.14);
--blu:#5CB4F7;--bluS:rgba(92,180,247,.14);
--dng:#FF7A8A;--dngS:rgba(255,122,138,.14);
--tx:#eaeaf2;--tx2:#8c9ac0;--tx3:#556289;
--bd:rgba(255,255,255,.08);--r:14px;--r2:9px;
}
html{overscroll-behavior-y:none;height:100%}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);max-width:560px;margin:0 auto;padding-bottom:calc(70px + env(safe-area-inset-bottom));overscroll-behavior-y:none;overscroll-behavior-x:none}
input,select,textarea,button{font-family:inherit}
.hide{display:none!important}

/* AUTH */
#auth{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px;text-align:center}
.aLogo{width:132px;margin-bottom:18px}
.aTit{font-family:Raleway,-apple-system,sans-serif;font-weight:900;font-size:31px;letter-spacing:-.7px;line-height:1}
.aTit .p{color:var(--red)}.aTit .k{color:var(--yel)}.aTit .s{color:var(--gold);font-size:18px;margin-left:3px;letter-spacing:.8px}
.aSub{color:var(--tx2);font-size:14px;margin:6px 0 34px}
.gBtn{display:flex;align-items:center;gap:10px;background:#fff;color:#2c2c3a;border:0;border-radius:11px;padding:13px 26px;font-size:15px;font-weight:700;cursor:pointer}

/* HEADER */
header{position:sticky;top:0;z-index:60;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 0}
.hTop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:9px}
.brand img{width:38px;height:auto;display:block;flex:none}
.wm{font-family:Raleway,-apple-system,sans-serif;font-weight:900;font-size:21px;letter-spacing:-.5px;line-height:1}
.wm .p{color:var(--red)}.wm .k{color:var(--yel)}.wm .s{color:var(--gold);font-size:13px;margin-left:2px;letter-spacing:.6px}
.hRight{display:flex;align-items:center;gap:8px}
.sync{font-size:10px;color:var(--tx3);display:flex;align-items:center;gap:4px}
.syncDot{width:6px;height:6px;border-radius:50%;background:var(--grn)}
.syncDot.busy{background:var(--yel)}
.syncDot.err{background:var(--dng)}
.iBtn{background:var(--surf2);border:0;color:var(--tx2);width:32px;height:32px;border-radius:9px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.srch{position:relative;margin-bottom:10px}
.srch input{width:100%;background:var(--surf);border:1px solid var(--bd);border-radius:11px;padding:10px 34px 10px 34px;color:var(--tx);font-size:14px;outline:none}
.srch input:focus{border-color:var(--red)}
.srch .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:13px}
.srch .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:var(--surf2);border:0;color:var(--tx2);width:22px;height:22px;border-radius:50%;font-size:13px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding-bottom:10px}
.st{background:var(--surf);border-radius:10px;padding:7px 4px;text-align:center}
.stV{font-size:17px;font-weight:800;line-height:1.1}
.stL{font-size:9.5px;color:var(--tx2);margin-top:2px}
.st.a .stV{color:var(--red)}.st.b .stV{color:var(--yel)}.st.c .stV{color:var(--blu)}.st.d .stV{color:var(--grn);font-size:14px}

/* CONTENT */
main{padding:4px 16px 20px}
.sortBar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.sBtn{display:flex;align-items:center;gap:4px;background:var(--surf);border:1px solid var(--bd);color:var(--tx2);font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:20px;cursor:pointer}
.sBtn.on{background:var(--redS);border-color:transparent;color:var(--red)}
.sBtn.bx{margin-left:auto}
.sBtn.bx.on{background:var(--bluS);color:var(--blu)}
.bxRow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:calc(100% - 36px);margin:0 18px 7px;background:var(--surf2);border:1px solid transparent;border-radius:var(--r2);padding:11px 13px;color:var(--tx);font-size:14px;font-weight:600;cursor:pointer;text-align:left}
.bxRow.on{border-color:var(--blu);color:var(--blu)}
.bxRow .n{font-size:11.5px;color:var(--tx2);font-weight:500}
.bxRow.on .n{color:var(--blu);opacity:.8}
.sBtn .ar{font-size:9px;opacity:.85;line-height:1}
.secH{font-size:10.5px;font-weight:800;color:var(--tx3);letter-spacing:.9px;text-transform:uppercase;margin:16px 0 9px;display:flex;align-items:center;gap:7px}
.secH:first-child{margin-top:4px}
.secH span{background:var(--surf2);color:var(--tx2);border-radius:9px;padding:1px 6px;font-size:9.5px;letter-spacing:0}

/* CARD */
.card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:8px;overflow:hidden;cursor:pointer}
.cIn{display:flex;min-height:70px}
.cPh{width:76px;flex-shrink:0;align-self:stretch;background:var(--surf2);display:flex;align-items:center;justify-content:center;color:var(--tx3);cursor:pointer;overflow:hidden;position:relative}
.cPh img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cPh.has .ph-holder{display:none}
#lb{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,2,10,.94);align-items:center;justify-content:center;padding:16px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
#lbX{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;background:rgba(255,255,255,.14);border:0;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:9px}
.cBd{flex:1;padding:8px 11px;min-width:0}
.cNm{font-size:14px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cSub{font-size:11px;color:var(--tx2);margin-top:2px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.chip{font-size:10.5px;padding:2px 7px;border-radius:9px;font-weight:600;white-space:nowrap}
.cA{background:var(--redS);color:var(--red)}
.cY{background:var(--yelS);color:var(--yel)}
.cG{background:var(--grnS);color:var(--grn)}
.cB{background:var(--bluS);color:var(--blu)}
.cO{background:var(--bluS);color:var(--blu)}
.acts{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.aBtn{font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;border:0;cursor:pointer;background:var(--surf2);color:var(--tx2)}
.aBtn.p{background:var(--redS);color:var(--red)}
.aBtn.g{background:var(--grnS);color:var(--grn)}
.aBtn.y{background:var(--yelS);color:var(--yel)}
.aBtn.o{background:var(--bluS);color:var(--blu)}
.aBtn.d{background:var(--dngS);color:var(--dng)}

/* ORDER */
.ord{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.ordH{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;background:var(--surf2)}
.ordN{font-size:14px;font-weight:700}
.ordM{font-size:11px;color:var(--tx2);margin-top:2px}
.ordT{font-size:16px;font-weight:800;color:var(--grn)}
.ordL{padding:4px 13px 10px}
.ordI{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:13px}
.ordI:last-child{border-bottom:0}
.ordI .th{width:34px;height:34px;border-radius:7px;background:var(--surf2);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--tx3)}
.ordI .th img{width:100%;height:100%;object-fit:cover}
.ordI .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ordI .pr{color:var(--grn);font-weight:700;font-size:12.5px}
.ordF{padding:0 13px 12px}

/* HISTO */
.hCard{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:9px;padding:12px 13px}
.hTitle{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hName{font-size:15px;font-weight:700}
.hCnt{font-size:11px;color:var(--tx2)}
.hStats{display:flex;gap:14px;margin-top:7px;font-size:11px;color:var(--tx2)}
.hStats b{color:var(--tx);font-size:13px;display:block;font-weight:700}
.hList{margin-top:10px;border-top:1px solid var(--bd);padding-top:8px}
.hRow{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 0;color:var(--tx2)}
.hRow b{color:var(--grn);font-weight:700}

/* EMPTY */
.empty{text-align:center;padding:52px 22px;color:var(--tx3)}
.empty .e1{margin-bottom:14px;opacity:.5;color:var(--tx3)}
.empty .e2{font-size:14px;line-height:1.5}

/* SHEET */
.ovl{display:none;position:fixed;inset:0;z-index:200;background:rgba(6,6,12,.72);align-items:flex-end;justify-content:center}
.ovl.on{display:flex}
.sheet{background:var(--surf);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:93vh;overflow-y:auto;padding-bottom:calc(26px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:36px;height:4px;background:var(--surf3);border-radius:3px;margin:11px auto 4px}
.shT{font-size:16px;font-weight:800;padding:6px 18px 4px}
.shS{font-size:12px;color:var(--tx2);padding:0 18px 12px}
.fld{padding:0 18px;margin-bottom:13px}
.lbl{font-size:11.5px;color:var(--tx2);font-weight:600;margin-bottom:5px;display:block}
.inp{width:100%;background:var(--surf2);border:1px solid var(--bd);border-radius:var(--r2);padding:11px 12px;color:var(--tx);font-size:15px;outline:none}
.inp:focus{border-color:var(--red)}
textarea.inp{height:66px;resize:none;font-size:13px;line-height:1.5}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px;margin-bottom:13px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 18px;margin-bottom:13px}
.row2 .fld,.row3 .fld{padding:0;margin:0}
.phZ{width:100%;height:106px;background:var(--surf2);border:2px dashed var(--bd);border-radius:var(--r2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--tx3);font-size:12.5px;position:relative;cursor:pointer;overflow:hidden}
.phZ input{position:absolute;inset:0;opacity:0;cursor:pointer}
.phZ img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#00040f}
.phZ.has .ph-holder{display:none}
.phE{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.65);border:0;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;z-index:5;display:none;align-items:center;justify-content:center;padding:6px}
.phZ.has input{display:none}
.phZ.has{cursor:zoom-in;border-style:solid}
.phZ.has .phE{display:flex}
.phZ.has .phX{display:flex}
.phX{display:none;align-items:center;justify-content:center;padding:6px}
.phX{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.65);border:0;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;z-index:5}
.shF{display:flex;gap:9px;padding:6px 18px 0}
.bP{flex:1;background:var(--red);color:#fff;border:0;border-radius:var(--r2);padding:13px;font-size:15px;font-weight:700;cursor:pointer}
.bP.g{background:var(--grn)}.bP.r{background:var(--dng);color:#2b0a10}
.bS{background:var(--surf2);color:var(--tx2);border:0;border-radius:var(--r2);padding:13px 18px;font-size:15px;font-weight:600;cursor:pointer}
.dgr{width:calc(100% - 36px);margin:14px 18px 0;background:transparent;border:1px solid var(--dngS);color:var(--dng);border-radius:var(--r2);padding:10px;font-size:13px;font-weight:600;cursor:pointer}

/* CONFIRM */
.cfm{display:none;position:fixed;inset:0;z-index:300;background:rgba(6,6,12,.8);align-items:center;justify-content:center;padding:24px}
.cfm.on{display:flex}
.cfmB{background:var(--surf);border-radius:var(--r);padding:22px 20px;width:100%;max-width:310px;text-align:center}
.cfmT{font-weight:800;font-size:15px;margin-bottom:7px}
.cfmX{font-size:13px;color:var(--tx2);margin-bottom:18px;line-height:1.5}

/* TOAST */
#toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(12px);background:var(--surf3);color:var(--tx);padding:10px 18px;border-radius:22px;font-size:13px;font-weight:600;z-index:400;opacity:0;transition:.24s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}

/* NAV */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:var(--surf);border-top:1px solid var(--bd);display:flex;padding:9px 0 calc(9px + env(safe-area-inset-bottom));z-index:100;overflow:hidden}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--tx3);font-size:10px;font-weight:600;position:relative;padding-top:2px;transition:color .15s}
.nv+.nv::after{content:'';position:absolute;left:0;top:22%;bottom:22%;width:1px;background:var(--bd)}
.nv::before{content:'';position:absolute;top:-8px;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:transparent;transition:background .15s}
.nv.on::before{background:var(--gold)}
.nv.on{color:var(--gold)}
.nvI{width:21px;height:21px;display:block}
.nvB{position:absolute;top:-2px;right:50%;margin-right:-20px;background:var(--blu);color:#00071a;font-size:9px;font-weight:800;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.fab{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom));right:max(16px,calc(50% - 264px));width:52px;height:52px;border-radius:50%;background:var(--red);color:#fff;border:0;font-size:27px;font-weight:300;cursor:pointer;z-index:99;box-shadow:0 5px 18px rgba(124,106,247,.42);display:flex;align-items:center;justify-content:center}
.hint{font-size:11.5px;color:var(--tx3);text-align:center;padding:14px 20px 0;line-height:1.5}

/* ═══ TABLETTE / GRAND ÉCRAN ═══ */
@media (min-width:760px){
  body{max-width:1060px;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
  header{padding-left:22px;padding-right:22px}
  main{padding:6px 22px 28px}
  nav{max-width:1060px;padding:10px 0 calc(11px + env(safe-area-inset-bottom))}
  .nv{font-size:11px;gap:4px}
  .nvI{width:23px;height:23px}
  .fab{width:56px;height:56px;font-size:29px;right:max(22px,calc(50% - 508px));bottom:calc(90px + env(safe-area-inset-bottom))}
  .stats{gap:10px;padding-bottom:12px}
  .st{padding:10px 6px}
  .stV{font-size:21px}
  .stL{font-size:11px}
  .srch input{font-size:15px;padding:12px 36px}
  .wm{font-size:24px}
  .wm .s{font-size:15px}
  .brand img{width:44px}

  #view{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:11px;align-items:start}
  #view>.secH{grid-column:1/-1;margin:14px 0 -1px}
  #view>.sortBar{grid-column:1/-1}
  #view>.secH:first-child{margin-top:2px}
  #view>.empty{grid-column:1/-1}
  #view>.card,#view>.ord,#view>.hCard{margin-bottom:0}
  #view>.ord{grid-column:span 1}
  .cPh{width:92px}
  .cIn{min-height:82px}

  .ovl{align-items:center;padding:26px}
  .sheet{border-radius:18px;max-width:560px;max-height:86vh;padding-bottom:26px;animation:pop .2s ease}
  .grab{display:none}
  .shT{padding-top:18px}
  .phZ{height:150px}
}
@keyframes pop{from{transform:scale(.97);opacity:.5}to{transform:none;opacity:1}}

@media (min-width:1180px){
  body{max-width:1280px}
  nav{max-width:1280px}
  .fab{right:max(22px,calc(50% - 618px))}
  #view{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
}
.tagBox{background:var(--surf2);border-radius:var(--r2);padding:11px 12px;font-size:12px;color:var(--tx2);line-height:1.55;margin:0 18px 12px;word-break:break-word;max-height:130px;overflow-y:auto}
</style>
</head>
<body>

<div id="auth">
  <img class="aLogo" src="icons/logo.png" alt="">
  <div class="aTit"><span class="p">Po</span><span class="k">Koala</span><span class="s">Shop</span></div>
  <div class="aSub">Ta boutique Vinted, hors de Vinted</div>
  <button class="gBtn" id="btnSignin">Connexion avec Google</button>
</div>

<div id="app" class="hide">
  <header>
    <div class="hTop">
      <div class="brand"><img src="icons/logo.png" alt=""><div class="wm"><span class="p">Po</span><span class="k">Koala</span><span class="s">Shop</span></div></div>
      <div class="hRight">
        <div class="sync"><span class="syncDot" id="syncDot"></span><span id="syncTx">—</span></div>
        <button class="iBtn" id="btnTags" title="Hashtags">#</button>
        <button class="iBtn" id="btnAcc" aria-label="Compte"><span style="width:16px;height:16px;display:block"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%;display:block"><circle cx="12" cy="12" r="10"/> <circle cx="12" cy="10" r="3"/> <path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"/></svg></span></button>
      </div>
    </div>
    <div class="srch">
      <span class="ic" style="width:14px;height:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%;display:block"><path d="m21 21-4.34-4.34"/> <circle cx="11" cy="11" r="8"/></svg></span>
      <input type="search" id="q" placeholder="Nom, Pokémon, boîte…" autocomplete="off">
      <button class="clr hide" id="qClr">×</button>
    </div>
    <div class="stats">
      <div class="st a"><div class="stV" id="s1">0</div><div class="stL">Vitrine</div></div>
      <div class="st b"><div class="stV" id="s2">0</div><div class="stL">À faire</div></div>
      <div class="st c"><div class="stV" id="s3">0</div><div class="stL">À expédier</div></div>
      <div class="st d"><div class="stV" id="s4">0€</div><div class="stL">Revenus</div></div>
    </div>
  </header>

  <main id="view"></main>

  <button class="fab" id="fab">+</button>

  <nav>

/* ═══ UTIL ═══ */
function $(id){ return document.getElementById(id); }
function norm(s){
  return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function now(){ return new Date().toISOString(); }
function num(v){ var n = parseFloat(v); return isNaN(n) ? null : n; }
function eur(n){ return (n==null?0:n).toFixed(2).replace('.',',') + '€'; }
function eur0(n){ return Math.round(n==null?0:n) + '€'; }
function toDateInput(iso){
  if(!iso) return '';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  var m = String(d.getMonth()+1).padStart(2,'0'), j = String(d.getDate()).padStart(2,'0');
  return d.getFullYear() + '-' + m + '-' + j;
}
function fromDateInput(v){
  if(!v) return null;
  var p2 = v.split('-');
  if(p2.length !== 3) return null;
  var d = new Date(parseInt(p2[0],10), parseInt(p2[1],10)-1, parseInt(p2[2],10), 12, 0, 0);
  if(isNaN(d.getTime())) return null;
  return d.toISOString();
}
function ageDays(s){
  if(!s) return null;
  var d = new Date(s);
  if(isNaN(d.getTime())) return null;
  var a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var n = new Date();
  var b = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.round((b - a) / 86400000);
}
function ageTxt(s){
  var d = ageDays(s);
  if(d == null) return '';
  if(d <= 0) return 'mis en ligne aujourd\'hui';
  if(d === 1) return 'mis en ligne hier';
  return 'mis en ligne il y a ' + d + ' jours';
}
function dt(s){ if(!s) return '—'; var d=new Date(s); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'}); }

/* ═══ IDB (cache photos) ═══ */
var idb = null;
function openIdb(){
  return new Promise(function(res){
    var r = indexedDB.open('pokoalashop', 1);
    r.onupgradeneeded = function(e){
      var db = e.target.result;
      if(!db.objectStoreNames.contains('ph')) db.createObjectStore('ph');
    };
    r.onsuccess = function(e){ idb = e.target.result; res(); };
    r.onerror = function(){ res(); };
  });
}
function idbGet(k){
  return new Promise(function(res){
    if(!idb) return res(null);
    var t = idb.transaction('ph','readonly').objectStore('ph').get(k);
    t.onsuccess = function(){ res(t.result || null); };
    t.onerror = function(){ res(null); };
  });
}
function idbPut(k, v){
  return new Promise(function(res){
    if(!idb) return res();
    var t = idb.transaction('ph','readwrite').objectStore('ph').put(v, k);
    t.onsuccess = function(){ res(); }; t.onerror = function(){ res(); };
  });
}

/* ═══ AUTH ═══ */
function initGis(){
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPES,
    callback: function(r){
      if(r.error){ toast('Connexion refusée'); return; }
      token = r.access_token;
      tokenExp = Date.now() + (parseInt(r.expires_in,10) || 3500) * 1000;
      try{ localStorage.setItem('pks_tk', JSON.stringify({ t: token, e: tokenExp })); }catch(e){}
      start();
    }
  });
}
function signIn(){ tokenClient.requestAccessToken({ prompt: '' }); }
function reauth(){ tokenClient.requestAccessToken({ prompt: '' }); }

function api(url, opts){
  opts = opts || {};
  opts.headers = opts.headers || {};
  opts.headers.Authorization = 'Bearer ' + token;
  return fetch(url, opts).then(function(r){
    if(r.status === 401){
      token = null;
      try{ localStorage.removeItem('pks_tk'); }catch(e){}
      reauth(); throw new Error('auth');
    }
    return r;
  });
}

async function start(){
  await openIdb();
  try{
    var r = await api('https://www.googleapis.com/oauth2/v3/userinfo');
    me = await r.json();
  }catch(e){ me = {}; }
  who = localStorage.getItem('pks_who');
  if(!who || !WHOS[who]){ askWho(); return; }
  boot();
}

    '<div class="fld" style="display:flex;gap:10px">' +

  );

    b[i].onclick = function(){
      who = this.getAttribute('data-who');

async function boot(){
  myFile = PREFIX + who + '.json';
  $('auth').classList.add('hide');
  $('app').classList.remove('hide');

  pollTimer = setInterval(function(){ if(!sheetOpen && !saving) sync(false); }, POLL_MS);

/* ═══ DRIVE ═══ */
function setSync(state, txt){
  var d = $('syncDot'); d.className = 'syncDot' + (state ? ' ' + state : '');
  $('syncTx').textContent = txt;
}

async function listFiles(){
  var url = 'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&pageSize=100&fields=files(id,name,modifiedTime)&q=' +
    encodeURIComponent("name contains '" + PREFIX + "' and trashed=false");
  var r = await api(url);
  var j = await r.json();
  return j.files || [];
}

/* fusion : un lot gagne s'il a le updatedAt le plus récent */
function mergeInto(map, arr){
  for(var i=0;i<arr.length;i++){
    var l = arr[i];
    if(!l || !l.id) continue;
    var prev = map[l.id];
    if(!prev || String(l.updatedAt||'') > String(prev.updatedAt||'')) map[l.id] = l;
  }
}

async function sync(full){
  if(saving) return;
  setSync('busy','sync…');
  try{
    var files = await listFiles();
    var map = {};
    myFileId = null;
    for(var i=0;i<files.length;i++){
      var f = files[i];
      if(f.name === myFile) myFileId = f.id;
      var rr = await api('https://www.googleapis.com/drive/v3/files/' + f.id + '?alt=media');
      var data = await rr.json().catch(function(){ return {}; });
      if(data && data.lots) mergeInto(map, data.lots);
      if(f.name === myFile && data){
        if(data.tagTpl) tagTpl = data.tagTpl;
        var own = data.lots || [];
        for(var z=0;z<own.length;z++){
          var cur = savedLots[own[z].id];
          if(!cur || String(own[z].updatedAt||'') > String(cur.updatedAt||'')) savedLots[own[z].id] = own[z];
        }
      }
    }
    var out = [];
    for(var k in map){ if(!map[k].deleted) out.push(map[k]); }
    out.sort(function(a,b){ return String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')); });
    lots = out;
    setSync('', 'à jour');
    render();
  }catch(e){
    if(e.message !== 'auth') setSync('err','hors ligne');
  }
}

var savedLots = {};
async function save(){
  if(saving){ dirty = true; return; }
  saving = true; setSync('busy','sync…');
  try{
    var body = { v: APP_VERSION, tagTpl: tagTpl, updated: now(), lots: [] };
    for(var k in savedLots) body.lots.push(savedLots[k]);
    var json = JSON.stringify(body);
    if(!myFileId){
      var m = await api('https://www.googleapis.com/drive/v3/files?fields=id', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ name: myFile, parents: ['appDataFolder'] })
      });
      myFileId = (await m.json()).id;
    }
    await api('https://www.googleapis.com/upload/drive/v3/files/' + myFileId + '?uploadType=media', {
      method:'PATCH', headers:{'Content-Type':'application/json'}, body: json
    });
    setSync('','à jour');
  }catch(e){
    if(e.message !== 'auth') setSync('err','non sauvé');
  }
  saving = false;
  if(dirty){ dirty = false; save(); }
}

/* écrit un lot : dans mon fichier + dans la vue locale */
function commit(lot){
  lot.updatedAt = now();
  lot.by = who || 'moi';
  savedLots[lot.id] = lot;
  var i = -1;
  for(var j=0;j<lots.length;j++){ if(lots[j].id === lot.id){ i = j; break; } }
  if(lot.deleted){ if(i>=0) lots.splice(i,1); }
  else if(i>=0) lots[i] = lot;
  else lots.unshift(lot);
  render();
  save();
}

/* ═══ PHOTOS ═══ */
function shrink(file){
  return new Promise(function(res){
    var img = new Image();
    img.onload = function(){
      var max = 900, w = img.width, h = img.height;
      if(w > h && w > max){ h = Math.round(h*max/w); w = max; }
      else if(h > max){ w = Math.round(w*max/h); h = max; }
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(function(b){ res(b); }, 'image/jpeg', 0.82);
    };
    img.onerror = function(){ res(null); };
    img.src = URL.createObjectURL(file);
  });
}
async function uploadPhoto(blob){
  var meta = { name: 'ph_' + nid() + '.jpg', parents: ['appDataFolder'] };
  var fd = new FormData();
  fd.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
  fd.append('file', blob);
  var r = await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method:'POST', body: fd });
  var j = await r.json();
  await idbPut(j.id, blob);
  return j.id;
}
var urlCache = {};
async function photoUrl(id){
  if(!id) return null;
  if(urlCache[id]) return urlCache[id];
  var b = await idbGet(id);
  if(!b){
    try{
      var r = await api('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media');
      b = await r.blob();
      await idbPut(id, b);
    }catch(e){ return null; }
  }
  urlCache[id] = URL.createObjectURL(b);
  return urlCache[id];
}
function hydratePhotos(){
  var els = document.querySelectorAll('[data-ph]');
  for(var i=0;i<els.length;i++){
    (function(el){
      var id = el.getAttribute('data-ph');
      el.removeAttribute('data-ph');
      photoUrl(id).then(function(u){
        if(!u) return;
        var img = document.createElement('img');
        img.src = u; img.alt = '';
        el.insertBefore(img, el.firstChild);
        el.classList.add('has');
      });
    })(els[i]);
  }
}

}

}

/* ═══ SELECTORS ═══ */
function byStatus(s){ return lots.filter(function(l){ return l.st === s; }); }
function query(){ return ($('q').value || '').trim(); }
function matches(l, q){
  var n = norm(q);
  if(!n) return true;
  return norm(l.nom).indexOf(n) >= 0 ||
         norm(l.poke).indexOf(n) >= 0 ||
         norm(l.boite).indexOf(n) >= 0 ||
         norm(l.sep).indexOf(n) >= 0 ||
         norm(l.notes).indexOf(n) >= 0 ||
         norm(l.acheteur).indexOf(n) >= 0;
}
function lotTitle(l){
  if(l.nom) return l.nom;
  var p = l.poke || 'Lot';
  return l.nb ? (p + ' — ' + l.nb + ' cartes') : p;
}

/* ═══ RENDER ═══ */
function render(){
  var vitrine = byStatus('vitrine').length;
  var afaire = byStatus('afaire').length + byStatus('pret').length;
  var vendus = byStatus('vendu').length;
  var rev = 0;
  for(var i=0;i<lots.length;i++){
    if(lots[i].st === 'vendu' || lots[i].st === 'expedie') rev += (num(lots[i].pv) || 0);
  }
  $('s1').textContent = vitrine;
  $('s2').textContent = afaire;
  $('s3').textContent = vendus;
  $('s4').textContent = eur0(rev);
  setBadge('nb2', afaire);
  setBadge('nb3', vendus);
  $('qClr').classList.toggle('hide', !query());

  var q = query();
  if(q){ renderSearch(q); }
  else if(tab === 'vitrine') renderVitrine();
  else if(tab === 'afaire') renderAfaire();
  else if(tab === 'cmd') renderCmd();
  else renderHisto();
  hydratePhotos();
}
function setBadge(id, n){
  var e = $(id);
  e.textContent = n; e.classList.toggle('hide', n === 0);
}

function empty(icon, txt){
  return '<div class="empty"><div class="e1">' + icon + '</div><div class="e2">' + txt + '</div></div>';
}

function renderSearch(q){
  var res = lots.filter(function(l){ return matches(l, q); });
  if(!res.length){ $('view').innerHTML = empty('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" style="width:54px;height:54px;display:block;margin:0 auto"><path d="m21 21-4.34-4.34"/> <circle cx="11" cy="11" r="8"/></svg>','Aucun lot ne correspond à « ' + esc(q) + ' »'); return; }
  var h = '<div class="secH">Résultats <span>' + res.length + '</span></div>';
  h += res.map(card).join('');
  $('view').innerHTML = h;
}

var EMPTY_VITRINE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" style="width:54px;height:54px;display:block;margin:0 auto"><path d="M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5"/> <path d="M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244"/> <path d="M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05"/></svg>';
var SORTS = { date:'Ancienneté', alpha:'Nom', prix:'Prix' };

function sortLots(arr){
  var out = arr.slice();
  out.sort(function(a,b){
    var r = 0;
    if(sortKey === 'alpha'){
      r = lotTitle(a).localeCompare(lotTitle(b), 'fr', { sensitivity:'base' });
    } else if(sortKey === 'prix'){
      var pa = num(a.pa), pb = num(b.pa);
      if(pa == null && pb == null) r = 0;
      else if(pa == null) r = -1;
      else if(pb == null) r = 1;
      else r = pa - pb;
    } else {
      r = String(a.dtListe || a.dtCree || '').localeCompare(String(b.dtListe || b.dtCree || ''));
    }
    return r * sortDir;
  });
  return out;
}

function cmpBox(a, b){
  var na = parseFloat(a), nb = parseFloat(b);
  var aN = !isNaN(na) && /^[0-9]/.test(a), bN = !isNaN(nb) && /^[0-9]/.test(b);
  if(aN && bN) return na - nb;
  if(aN) return -1;
  if(bN) return 1;
  return String(a).localeCompare(String(b), 'fr', { sensitivity:'base' });
}
function allBoxes(){
  var seen = {}, out = [];
  for(var i=0;i<lots.length;i++){
    var b = (lots[i].boite || '').trim();
    if(!b) continue;
    var k = norm(b);
    if(!seen[k]){ seen[k] = b; out.push(b); }
  }
  out.sort(cmpBox);
  return out;
}
function boxCount(b){
  var n = 0;
  for(var i=0;i<lots.length;i++){
    if(lots[i].st === 'vitrine' && norm(lots[i].boite) === norm(b)) n++;
  }
  return n;
}
function sheetBoxes(){
  var boxes = allBoxes();
  var rows = '<button class="bxRow' + (boxFilter === null ? ' on' : '') + '" data-box="">Toutes les boîtes' +
    '<span class="n">' + byStatus('vitrine').length + ' en vitrine</span></button>';
  if(!boxes.length){
    rows += '<div class="hint">Aucune boîte renseignée pour l\'instant. Indique un numéro de boîte sur un lot et il apparaîtra ici.</div>';
  }
  for(var i=0;i<boxes.length;i++){
    var b = boxes[i], c = boxCount(b);
    rows += '<button class="bxRow' + (norm(boxFilter) === norm(b) && boxFilter !== null ? ' on' : '') +
      '" data-box="' + esc(b) + '">Boîte ' + esc(b) +
      '<span class="n">' + c + ' en vitrine</span></button>';
  }
  openSheet('<div class="shT">Filtrer par boîte</div>' +
    '<div class="shS">La liste se construit à partir des boîtes saisies sur tes lots.</div>' +
    rows +
    '<div class="shF"><button class="bS" style="flex:1" id="bxc">Fermer</button></div>');
  $('bxc').onclick = closeSheet;
  var rs = document.querySelectorAll('[data-box]');
  for(var j=0;j<rs.length;j++){
    rs[j].onclick = function(){
      var v = this.getAttribute('data-box');
      boxFilter = v === '' ? null : v;
      closeSheet(); render();
    };
  }
}

function sortBar(){
  var arrows = { date: sortDir === -1 ? 'Récents d\'abord' : 'Anciens d\'abord',
                 alpha: sortDir === -1 ? 'Z → A' : 'A → Z',
                 prix: sortDir === -1 ? 'Prix décroissant' : 'Prix croissant' };
  var h2 = '<div class="sortBar">';
  for(var k in SORTS){
    var on = (k === sortKey);
    h2 += '<button class="sBtn' + (on ? ' on' : '') + '" data-sort="' + k + '">' + SORTS[k] +
      (on ? '<span class="ar">' + (sortDir === -1 ? '▼' : '▲') + '</span>' : '') + '</button>';
  }
  h2 += '<button class="sBtn bx' + (boxFilter !== null ? ' on' : '') + '" data-boxpick="1">' +
    (boxFilter !== null ? 'Boîte ' + esc(boxFilter) + '<span class="ar">×</span>' : 'Boîte') + '</button>';
  h2 += '</div>';
  return h2 + '<div class="hint" style="padding:0 0 8px;text-align:left;font-size:11px">' + arrows[sortKey] + '</div>';
}

function renderVitrine(){
  var all = byStatus('vitrine');
  if(!all.length){ $('view').innerHTML = empty(EMPTY_VITRINE,'Rien en vitrine.<br>Prépare un lot puis mets-le en ligne.'); return; }
  var v = all;
  if(boxFilter !== null) v = all.filter(function(l){ return norm(l.boite) === norm(boxFilter); });
  var head = sortBar();
  if(!v.length){
    $('view').innerHTML = head + empty(EMPTY_VITRINE, 'Aucun lot en vitrine dans la boîte ' + esc(boxFilter) + '.');
    return;
  }
  var lbl = boxFilter !== null ? 'Boîte ' + esc(boxFilter) : 'En vitrine';
  $('view').innerHTML = head + '<div class="secH">' + lbl + ' <span>' + v.length + '</span></div>' + sortLots(v).map(card).join('');
}

function renderAfaire(){
  var a = byStatus('afaire'), p = byStatus('pret');

  var h = '';

  if(a.length) h += '<div class="secH">À préparer <span>' + a.length + '</span></div>' + a.map(card).join('');

function card(l){
  var ph = l.photo
    ? '<div class="cPh" data-ph="' + l.photo + '" data-open="' + l.id + '"></div>'
    : '<div class="cPh" data-open="' + l.id + '"><span class="ph-holder" style="width:26px;height:26px;display:block"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%;display:block"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/> <path d="M12 22V12"/> <polyline points="3.29 7 12 12 20.71 7"/> <path d="m7.5 4.27 9 5.15"/></svg></span></div>';

  var chips = [];
  if(l.nb) chips.push('<span class="chip cB">' + l.nb + ' cartes</span>');
  if(l.boite) chips.push('<span class="chip cO">Boîte ' + esc(l.boite) + (l.sep ? ' · ' + esc(l.sep) : '') + '</span>');
  if(num(l.pa) != null) chips.push('<span class="chip cA">' + eur(num(l.pa)) + '</span>');
  if(num(l.pm) != null) chips.push('<span class="chip cY">min ' + eur(num(l.pm)) + '</span>');
  if(num(l.pv) != null) chips.push('<span class="chip cG">vendu ' + eur(num(l.pv)) + '</span>');

  var acts = [];
  if(l.st === 'afaire'){
    acts.push('<button class="aBtn p" data-open="' + l.id + '">Compléter</button>');
    acts.push('<button class="aBtn y" data-mv="' + l.id + '|pret">Marquer préparé</button>');
    acts.push('<button class="aBtn p" data-list="' + l.id + '">Mettre en ligne</button>');
  } else if(l.st === 'pret'){
    acts.push('<button class="aBtn p" data-list="' + l.id + '">Mettre en ligne</button>');
  } else if(l.st === 'vitrine'){
    acts.push('<button class="aBtn g" data-sell="' + l.id + '">Marquer vendu</button>');
    acts.push('<button class="aBtn" data-tag="' + l.id + '">Hashtags</button>');
  } else if(l.st === 'vendu'){
    acts.push('<button class="aBtn o" data-mv="' + l.id + '|expedie">Marquer expédié</button>');
  } else if(l.st === 'expedie'){
    acts.push('<button class="aBtn p" data-again="' + l.id + '">Refaire ce lot</button>');
  }
  acts.push('<button class="aBtn" data-open="' + l.id + '" aria-label="Modifier"><span style="width:13px;height:13px;display:inline-block;vertical-align:-2px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%;display:block"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/> <path d="m15 5 4 4"/></svg></span></button>');

  var sub = [];
  if(l.poke && l.nom) sub.push(esc(l.poke));
  if(l.st === 'vendu' || l.st === 'expedie'){ if(l.acheteur) sub.push(esc(l.acheteur)); }
  if(l.st === 'vitrine' && l.dtListe) sub.push(ageTxt(l.dtListe));

  return '<div class="card" data-open="' + l.id + '"><div class="cIn">' + ph + '<div class="cBd">' +
    '<div class="cNm">' + esc(lotTitle(l)) + '</div>' +
    (sub.length ? '<div class="cSub">' + sub.join(' · ') + '</div>' : '') +
    (chips.length ? '<div class="chips">' + chips.join('') + '</div>' : '') +
    '<div class="acts">' + acts.join('') + '</div>' +
    '</div></div></div>';
}

function renderCmd(){
  var v = lots.filter(function(l){ return l.st === 'vendu'; });
  if(!v.length){ $('view').innerHTML = empty('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" style="width:54px;height:54px;display:block;margin:0 auto"><path d="M12 22V12"/> <path d="m16 17 2 2 4-4"/> <path d="M21 11.127V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.729l7 4a2 2 0 0 0 2 .001l1.32-.753"/> <path d="M3.29 7 12 12l8.71-5"/> <path d="m7.5 4.27 8.997 5.148"/></svg>','Aucune commande à expédier.'); return; }
  var groups = {};
  for(var i=0;i<v.length;i++){
    var key = norm(v[i].acheteur) || ('_' + v[i].id);
    if(!groups[key]) groups[key] = { nom: v[i].acheteur || 'Acheteur inconnu', items: [] };
    groups[key].items.push(v[i]);
  }
  var keys = Object.keys(groups);
  keys.sort(function(a,b){
    var da = groups[a].items[0].dtVente || '', db = groups[b].items[0].dtVente || '';
    return db.localeCompare(da);
  });
  var h = '<div class="secH">À expédier <span>' + keys.length + ' commande' + (keys.length>1?'s':'') + '</span></div>';
  for(var k=0;k<keys.length;k++){
    var g = groups[keys[k]];
    var tot = 0, ids = [];
    var rows = g.items.map(function(l){
      tot += (num(l.pv) || 0); ids.push(l.id);
      var th = l.photo ? '<div class="th" data-ph="' + l.photo + '"></div>' : '<div class="th"><span style="width:17px;height:17px;display:block"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%;display:block"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/> <path d="M12 22V12"/> <polyline points="3.29 7 12 12 20.71 7"/> <path d="m7.5 4.27 9 5.15"/></svg></span></div>';
      return '<div class="ordI">' + th + '<div class="nm">' + esc(lotTitle(l)) +
        (l.boite ? '<div style="font-size:11px;color:var(--tx3)">Boîte ' + esc(l.boite) + (l.sep?' · '+esc(l.sep):'') + '</div>' : '') +
        '</div><div class="pr">' + eur(num(l.pv)) + '</div></div>';
    }).join('');
    h += '<div class="ord"><div class="ordH"><div><div class="ordN">' + esc(g.nom) + '</div>' +
      '<div class="ordM">' + g.items.length + ' lot' + (g.items.length>1?'s':'') + ' · ' + dt(g.items[0].dtVente) + '</div></div>' +
      '<div class="ordT">' + eur(tot) + '</div></div>' +
      '<div class="ordL">' + rows + '</div>' +
      '<div class="ordF"><button class="bP g" style="width:100%;padding:11px;font-size:14px" data-ship="' + ids.join(',') + '">Tout marquer expédié</button></div></div>';
  }
  $('view').innerHTML = h;
}

function renderHisto(){
  var sold = lots.filter(function(l){ return l.st === 'vendu' || l.st === 'expedie'; });
  if(!sold.length){ $('view').innerHTML = empty('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" style="width:54px;height:54px;display:block;margin:0 auto"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/> <path d="M3 3v5h5"/> <path d="M12 7v5l4 2"/></svg>','Aucune vente enregistrée.'); return; }
  var g = {};
  for(var i=0;i<sold.length;i++){
    var p = (sold[i].poke || '?').trim();
    var key = norm(p);
    if(!g[key]) g[key] = { nom: p, items: [] };
    g[key].items.push(sold[i]);
  }
  var keys = Object.keys(g);
  keys.sort(function(a,b){ return g[b].items.length - g[a].items.length; });
  var total = 0;
  for(var s=0;s<sold.length;s++) total += (num(sold[s].pv) || 0);
  var h = '<div class="secH">Ventes <span>' + sold.length + ' lots · ' + eur(total) + '</span></div>';
  for(var k=0;k<keys.length;k++){
    var it = g[keys[k]].items.slice();
    it.sort(function(a,b){ return String(b.dtVente||'').localeCompare(String(a.dtVente||'')); });
    var sum = 0, mx = 0, mn = null;
    for(var j=0;j<it.length;j++){
      var pv = num(it[j].pv) || 0; sum += pv;
      if(pv > mx) mx = pv;
      if(mn === null || (pv > 0 && pv < mn)) mn = pv;
    }
    var avg = it.length ? sum / it.length : 0;
    var rows = it.map(function(l){
      return '<div class="hRow"><span>' + dt(l.dtVente) + (l.nb ? ' · ' + l.nb + ' cartes' : '') + '</span><b>' + eur(num(l.pv)) + '</b></div>';
    }).join('');
    h += '<div class="hCard"><div class="hTitle"><div class="hName">' + esc(g[keys[k]].nom) + '</div>' +
      '<div class="hCnt">' + it.length + ' vendu' + (it.length>1?'s':'') + '</div></div>' +
      '<div class="hStats"><div>Moyenne<b>' + eur(avg) + '</b></div><div>Max<b>' + eur(mx) + '</b></div><div>Min<b>' + eur(mn||0) + '</b></div><div>Total<b>' + eur(sum) + '</b></div></div>' +
      '<div class="hList">' + rows + '</div></div>';
  }
  $('view').innerHTML = h;
}

/* ═══ SHEETS ═══ */
function openSheet(html){
  $('sheet').innerHTML = '<div class="grab"></div>' + html;
  $('ovl').classList.add('on');
  sheetOpen = true;
}
function closeSheet(){
  var was = sheetOpen;
  $('ovl').classList.remove('on'); sheetOpen = false;
  if(was && history.state && history.state.d === 1) history.back();
}

var pendingPhoto = null;

/* création : tout saisissable d'un coup */
function sheetNew(defMode){
  pendingPhoto = null;
  var main = defMode || (tab === 'afaire' ? 'afaire' : 'vitrine');
  var alt  = main === 'vitrine' ? 'afaire' : 'vitrine';
  var lbl  = { vitrine:'Mettre en vitrine', afaire:'Ajouter à préparer' };
  openSheet(
    '<div class="shT">Nouveau lot</div>' +
    '<div class="shS">Seul le Pokémon est obligatoire. Tout le reste peut être complété plus tard.</div>' +
    '<div class="fld"><label class="lbl">Pokémon</label><input class="inp" id="f_poke" placeholder="Évoli" autocomplete="off"></div>' +
    '<div class="row2"><div class="fld"><label class="lbl">Nombre de cartes</label><input class="inp" id="f_nb" type="number" inputmode="numeric" placeholder="25"></div>' +
    '<div class="fld"><label class="lbl">Boîte</label><input class="inp" id="f_boite" placeholder="3" autocomplete="off"></div></div>' +
    '<div class="fld"><label class="lbl">Séparateur (optionnel)</label><input class="inp" id="f_sep" placeholder="Évoli B" autocomplete="off"></div>' +
    '<div class="row2"><div class="fld"><label class="lbl">Prix affiché</label><input class="inp" id="f_pa" type="number" inputmode="decimal" step="0.5" placeholder="12"></div>' +
    '<div class="fld"><label class="lbl">Prix mini accepté</label><input class="inp" id="f_pm" type="number" inputmode="decimal" step="0.5" placeholder="9"></div></div>' +
    '<div class="fld"><label class="lbl">Titre de l\'annonce (optionnel)</label><input class="inp" id="f_nom" placeholder="laisser vide = Pokémon + nb cartes"></div>' +
    '<div class="fld"><label class="lbl">En ligne sur Vinted depuis le (si déjà publié)</label><input class="inp" id="f_dl" type="date" max="' + toDateInput(now()) + '"></div>' +
    '<div class="fld"><label class="lbl">Photo (optionnel)</label>' + photoZone({ photo:null }) + '</div>' +
    '<div id="histoHint"></div>' +
    '<div class="shF"><button class="bS" id="x1">Annuler</button><button class="bP" id="k1">' + lbl[main] + '</button></div>' +
    '<button class="dgr" id="k1b" style="border-color:var(--bd);color:var(--tx2)">' + lbl[alt] + '</button>'
  );
  bindPhoto();
  $('x1').onclick = closeSheet;
  $('k1').onclick = function(){ createLot(main, 'k1'); };
  $('k1b').onclick = function(){ createLot(alt, 'k1b'); };
  $('f_poke').oninput = function(){ showHistoHint(this.value.trim()); };
  setTimeout(function(){ $('f_poke').focus(); }, 120);
}

function sheetQuick(){
  var added = 0;
  openSheet(
    '<div class="shT">Lots à préparer</div>' +
    '<div class="shS">Tape un Pokémon, valide, recommence. Les détails se complètent plus tard en touchant le lot.</div>' +
    '<div class="fld"><label class="lbl">Pokémon</label><input class="inp" id="q_poke" placeholder="Évoli" autocomplete="off" enterkeyhint="done"></div>' +
    '<div id="q_list"></div>' +
    '<div class="shF"><button class="bS" id="qx">Terminé</button><button class="bP" id="qk">Ajouter</button></div>' +
    '<button class="dgr" id="qf" style="border-color:var(--bd);color:var(--tx2)">Saisie complète avec prix et photo</button>'
  );
  var inp = $('q_poke');
  function add(){
    var poke = inp.value.trim();
    if(!poke){ inp.focus(); return; }
    var l = {
      id: nid(), poke: poke, nom: '', nb: null, boite: '', sep: '',
      st: 'afaire', pa: null, pm: null, pv: null,
      acheteur: '', notes: '', photo: null,
      dtCree: now(), dtPret: null, dtListe: null, dtVente: null, dtExp: null
    };
    commit(l);
    added++;
    var box = $('q_list');
    if(box) box.innerHTML = '<div class="hint">' + added + ' lot' + (added>1?'s':'') + ' ajouté' + (added>1?'s':'') + ' à la liste</div>';
    inp.value = ''; inp.focus();
  }
  $('qk').onclick = add;
  inp.onkeydown = function(e){ if(e.key === 'Enter'){ e.preventDefault(); add(); } };
  $('qx').onclick = closeSheet;
  $('qf').onclick = function(){ closeSheet(); setTimeout(function(){ sheetNew('afaire'); }, 260); };
  setTimeout(function(){ inp.focus(); }, 120);
}

function showHistoHint(poke){
  var box = $('histoHint');
  if(!box) return;
  if(!poke){ box.innerHTML = ''; return; }
  var past = lots.filter(function(x){
    return (x.st === 'vendu' || x.st === 'expedie') &&
      norm(x.poke) === norm(poke) && num(x.pv) != null;
  });
  if(!past.length){ box.innerHTML = ''; return; }
  var s = 0;
  for(var i=0;i<past.length;i++) s += num(past[i].pv);
  box.innerHTML = '<div class="hint">Historique ' + esc(poke) + ' : ' + past.length + ' vente' +
    (past.length>1?'s':'') + ', moyenne <b style="color:var(--grn)">' + eur(s/past.length) + '</b></div>';
}

async function createLot(mode, btnId){
  var poke = $('f_poke').value.trim();
  if(!poke){ toast('Le Pokémon est requis'); return; }
  var btn = $(btnId) || $('k1');
  btn.disabled = true; btn.textContent = '…';
  var photoId = null;
  if(pendingPhoto && pendingPhoto !== 'none'){
    try{ photoId = await uploadPhoto(pendingPhoto); }catch(e){}
  }
  var l = {
    id: nid(), poke: poke,
    nom: $('f_nom').value.trim(),
    nb: parseInt($('f_nb').value,10) || null,
    boite: $('f_boite').value.trim(), sep: $('f_sep').value.trim(),
    st: mode, pa: num($('f_pa').value), pm: num($('f_pm').value), pv: null,
    acheteur: '', notes: '', photo: photoId,
    dtCree: now(), dtPret: null, dtListe: null, dtVente: null, dtExp: null
  };
  var dl = $('f_dl') ? fromDateInput($('f_dl').value) : null;
  if(dl){ l.st = 'vitrine'; l.dtListe = dl; l.dtPret = dl; }
  else if(mode === 'vitrine'){ l.dtListe = now(); l.dtPret = now(); }
  closeSheet();
  commit(l);
  toast(mode === 'vitrine' ? 'Lot en vitrine' : 'Lot à préparer');
}

/* étape 2 : mise en ligne — prix + photo */
function sheetList(id){
  var l = lots.filter(function(x){ return x.id === id; })[0];
  if(!l) return;
  pendingPhoto = null;
  var past = lots.filter(function(x){
    return x.id !== id && (x.st === 'vendu' || x.st === 'expedie') &&
      norm(x.poke) === norm(l.poke) && num(x.pv) != null;
  });
  var hint = '';
  if(past.length){
    var s = 0;
    for(var i=0;i<past.length;i++) s += num(past[i].pv);
    hint = '<div class="hint">Historique ' + esc(l.poke) + ' : ' + past.length + ' vente' + (past.length>1?'s':'') +
      ', moyenne <b style="color:var(--grn)">' + eur(s/past.length) + '</b></div>';
  }
  openSheet(
    '<div class="shT">Mettre en ligne</div>' +
    '<div class="shS">' + esc(lotTitle(l)) + '</div>' +
    '<div class="fld"><label class="lbl">Photo de l\'annonce</label>' + photoZone(l) + '</div>' +
    '<div class="fld"><label class="lbl">Titre de l\'annonce (optionnel)</label><input class="inp" id="f_nom" value="' + esc(l.nom) + '" placeholder="' + esc(lotTitle(l)) + '"></div>' +
    '<div class="row2"><div class="fld"><label class="lbl">Prix affiché</label><input class="inp" id="f_pa" type="number" inputmode="decimal" step="0.5" value="' + (l.pa==null?'':l.pa) + '" placeholder="12"></div>' +
    '<div class="fld"><label class="lbl">Prix mini accepté</label><input class="inp" id="f_pm" type="number" inputmode="decimal" step="0.5" value="' + (l.pm==null?'':l.pm) + '" placeholder="9"></div></div>' +
    '<div class="fld"><label class="lbl">En ligne depuis le</label><input class="inp" id="f_dl" type="date" value="' + toDateInput(l.dtListe || now()) + '" max="' + toDateInput(now()) + '"></div>' +
    hint +
    '<div class="shF"><button class="bS" id="x2">Annuler</button><button class="bP" id="k2">Mettre en vitrine</button></div>' +
    '<button class="dgr" id="k2b" style="border-color:var(--bd);color:var(--tx2)">Copier les hashtags</button>'
  );
  bindPhoto();
  $('x2').onclick = closeSheet;
  $('k2b').onclick = function(){ copyTags(l); };
  $('k2').onclick = async function(){
    $('k2').textContent = '…'; $('k2').disabled = true;
    if(pendingPhoto){ try{ l.photo = await uploadPhoto(pendingPhoto); }catch(e){} }
    l.nom = $('f_nom').value.trim();
    l.pa = num($('f_pa').value); l.pm = num($('f_pm').value);
    l.st = 'vitrine'; l.dtListe = fromDateInput($('f_dl').value) || now();
    if(!l.dtPret) l.dtPret = now();
    closeSheet(); commit(l); toast('En vitrine');
  };
}

/* vente */
function sheetSell(id){
  var l = lots.filter(function(x){ return x.id === id; })[0];
  if(!l) return;
  var buyers = {};
  for(var i=0;i<lots.length;i++){ if(lots[i].st === 'vendu' && lots[i].acheteur) buyers[lots[i].acheteur] = 1; }
  var bl = Object.keys(buyers);
  var quick = bl.length
    ? '<div class="fld"><label class="lbl">Commandes en cours</label><div class="chips">' +
      bl.map(function(b){ return '<button class="aBtn p" data-buyer="' + esc(b) + '">' + esc(b) + '</button>'; }).join('') +
      '</div></div>'
    : '';
  openSheet(
    '<div class="shT">Lot vendu</div>' +
    '<div class="shS">' + esc(lotTitle(l)) + (num(l.pa)!=null ? ' · affiché ' + eur(num(l.pa)) : '') + '</div>' +
    '<div class="fld"><label class="lbl">Prix de vente réel</label><input class="inp" id="f_pv" type="number" inputmode="decimal" step="0.5" value="' + (l.pa==null?'':l.pa) + '"></div>' +
    '<div class="fld"><label class="lbl">Acheteur (pour grouper la commande)</label><input class="inp" id="f_ach" placeholder="pseudo Vinted" autocomplete="off" value="' + esc(l.acheteur) + '"></div>' +
    quick +
    '<div class="shF"><button class="bS" id="x3">Annuler</button><button class="bP g" id="k3">Enregistrer la vente</button></div>'
  );
  $('x3').onclick = closeSheet;
  var qb = document.querySelectorAll('[data-buyer]');
  for(var b=0;b<qb.length;b++){
    qb[b].onclick = function(){ $('f_ach').value = this.getAttribute('data-buyer'); };
  }
  $('k3').onclick = function(){
    var pv = num($('f_pv').value);
    if(pv == null){ toast('Indique le prix de vente'); return; }
    l.pv = pv; l.acheteur = $('f_ach').value.trim();
    l.st = 'vendu'; l.dtVente = now();
    closeSheet(); commit(l); toast('Vente enregistrée');
  };
  setTimeout(function(){ $('f_pv').focus(); $('f_pv').select(); }, 120);
}

/* édition complète */
function sheetEdit(id){
  var l = lots.filter(function(x){ return x.id === id; })[0];
  if(!l) return;
  pendingPhoto = null;
  openSheet(
    '<div class="shT">Modifier</div>' +
    '<div class="fld"><label class="lbl">Photo</label>' + photoZone(l) + '</div>' +
    '<div class="fld"><label class="lbl">Titre de l\'annonce</label><input class="inp" id="f_nom" value="' + esc(l.nom) + '" placeholder="' + esc(lotTitle(l)) + '"></div>' +
    '<div class="row2"><div class="fld"><label class="lbl">Pokémon</label><input class="inp" id="f_poke" value="' + esc(l.poke) + '"></div>' +
    '<div class="fld"><label class="lbl">Nb cartes</label><input class="inp" id="f_nb" type="number" inputmode="numeric" value="' + (l.nb==null?'':l.nb) + '"></div></div>' +
    '<div class="row2"><div class="fld"><label class="lbl">Boîte</label><input class="inp" id="f_boite" value="' + esc(l.boite) + '"></div>' +
    '<div class="fld"><label class="lbl">Séparateur</label><input class="inp" id="f_sep" value="' + esc(l.sep) + '"></div></div>' +
    '<div class="row3"><div class="fld"><label class="lbl">Affiché</label><input class="inp" id="f_pa" type="number" inputmode="decimal" step="0.5" value="' + (l.pa==null?'':l.pa) + '"></div>' +
    '<div class="fld"><label class="lbl">Mini</label><input class="inp" id="f_pm" type="number" inputmode="decimal" step="0.5" value="' + (l.pm==null?'':l.pm) + '"></div>' +
    '<div class="fld"><label class="lbl">Vendu</label><input class="inp" id="f_pv" type="number" inputmode="decimal" step="0.5" value="' + (l.pv==null?'':l.pv) + '"></div></div>' +
    '<div class="row2"><div class="fld"><label class="lbl">Statut</label><select class="inp" id="f_st">' +
      opt('afaire', l.st) + opt('pret', l.st) + opt('vitrine', l.st) + opt('vendu', l.st) + opt('expedie', l.st) +
    '</select></div>' +
    '<div class="fld"><label class="lbl">Acheteur</label><input class="inp" id="f_ach" value="' + esc(l.acheteur) + '"></div></div>' +
    '<div class="row2"><div class="fld"><label class="lbl">En ligne depuis le</label><input class="inp" id="f_dl" type="date" value="' + toDateInput(l.dtListe) + '" max="' + toDateInput(now()) + '"></div>' +
    '<div class="fld"><label class="lbl">Date de vente</label><input class="inp" id="f_dv" type="date" value="' + toDateInput(l.dtVente) + '" max="' + toDateInput(now()) + '"></div></div>' +
    '<div class="fld"><label class="lbl">Notes</label><textarea class="inp" id="f_notes" placeholder="Contenu, état, remarques…">' + esc(l.notes) + '</textarea></div>' +
    '<div class="shF"><button class="bS" id="x4">Annuler</button><button class="bP" id="k4">Enregistrer</button></div>' +
    '<button class="dgr" id="k4t" style="border-color:var(--bd);color:var(--tx2)">Copier les hashtags</button>' +
    '<button class="dgr" id="k4d">Supprimer ce lot</button>'
  );
  bindPhoto();
  $('x4').onclick = closeSheet;
  $('k4t').onclick = function(){ copyTags(l); };
  $('k4d').onclick = function(){
    confirmBox('Supprimer ce lot ?', lotTitle(l) + ' sera retiré pour toi et pour ' + (who === 'thomas' ? 'Cindy' : 'Thomas') + '.', 'Supprimer', function(){
      l.deleted = true; closeSheet(); commit(l); toast('Lot supprimé');
    });
  };
  $('k4').onclick = async function(){
    $('k4').textContent = '…'; $('k4').disabled = true;
    if(pendingPhoto){ try{ l.photo = await uploadPhoto(pendingPhoto); }catch(e){} }
    if(pendingPhoto === 'none') l.photo = null;
    l.nom = $('f_nom').value.trim();
    l.poke = $('f_poke').value.trim();
    l.nb = parseInt($('f_nb').value,10) || null;
    l.boite = $('f_boite').value.trim();
    l.sep = $('f_sep').value.trim();
    l.pa = num($('f_pa').value); l.pm = num($('f_pm').value); l.pv = num($('f_pv').value);
    l.acheteur = $('f_ach').value.trim();
    l.notes = $('f_notes').value.trim();
    var dl2 = fromDateInput($('f_dl').value);
    if(dl2 || $('f_dl').value === '') l.dtListe = dl2;
    var dv2 = fromDateInput($('f_dv').value);
    if(dv2 || $('f_dv').value === '') l.dtVente = dv2;
    var ns = $('f_st').value;
    if(ns !== l.st){
      l.st = ns;
      if(ns === 'vitrine' && !l.dtListe) l.dtListe = now();
      if(ns === 'vendu' && !l.dtVente) l.dtVente = now();
      if(ns === 'expedie' && !l.dtExp) l.dtExp = now();
    }
    closeSheet(); commit(l); toast('Enregistré');
  };
}
function opt(v, cur){ return '<option value="' + v + '"' + (v === cur ? ' selected' : '') + '>' + ST[v] + '</option>'; }

function photoZone(l){
  var holder = '<span class="ph-holder" style="font-size:13px">Ajouter la photo Vinted</span>';
  var attr = (l && l.photo) ? ' data-ph="' + l.photo + '"' : '';
  return '<div class="phZ" id="phZ"' + attr + '>' + holder +
    '<input type="file" accept="image/*" id="f_ph">' +
    '<button class="phE" type="button" id="phE" aria-label="Remplacer la photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%;display:block"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/> <path d="m15 5 4 4"/></svg></button>' +
    '<button class="phX" type="button" id="phX" aria-label="Retirer la photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%;display:block"><path d="M18 6 6 18"/> <path d="m6 6 12 12"/></svg></button></div>';
}

function bindPhoto(){
  var z = $('phZ');
  if(!z) return;
  var inp = $('f_ph');
  if(inp){
    inp.onchange = async function(){
      var f = inp.files[0]; if(!f) return;
      var b = await shrink(f); if(!b) return;
      pendingPhoto = b;
      var old = z.querySelector('img');
      if(old) old.remove();
      var img = document.createElement('img');
      img.src = URL.createObjectURL(b); img.alt = '';
      z.insertBefore(img, z.firstChild);
      z.classList.add('has');
    };
  }
  var e2 = $('phE');
  if(e2) e2.onclick = function(ev){
    ev.stopPropagation(); ev.preventDefault();
    if(inp) inp.click();
  };
  var x = $('phX');
  if(x) x.onclick = function(ev){
    ev.stopPropagation(); ev.preventDefault();
    pendingPhoto = 'none';
    var old = z.querySelector('img');
    if(old) old.remove();
    z.classList.remove('has');
  };
  z.onclick = function(ev){
    if(ev.target === e2 || ev.target === x || (e2 && e2.contains(ev.target)) || (x && x.contains(ev.target))) return;
    var img = z.querySelector('img');
    if(img) showLightbox(img.src);
  };
  hydratePhotos();
}

/* refaire un lot */
function sheetAgain(id){
  var src = lots.filter(function(x){ return x.id === id; })[0];
  if(!src) return;
  var past = lots.filter(function(x){
    return (x.st === 'vendu' || x.st === 'expedie') &&
      norm(x.poke) === norm(src.poke) && num(x.pv) != null;
  });
  var s = 0;
  for(var i=0;i<past.length;i++) s += num(past[i].pv);
  var hint = past.length
    ? '<div class="hint">' + past.length + ' vente' + (past.length>1?'s':'') + ' de ' + esc(src.poke) + ' · moyenne <b style="color:var(--grn)">' + eur(s/past.length) + '</b> · dernier ' + eur(num(past[0].pv)) + '</div>'
    : '';
  openSheet(
    '<div class="shT">Refaire un lot ' + esc(src.poke) + '</div>' +
    '<div class="shS">Nouveau lot à préparer. Ajuste le nombre de cartes.</div>' +
    '<div class="row2"><div class="fld"><label class="lbl">Nombre de cartes</label><input class="inp" id="f_nb" type="number" inputmode="numeric" value="' + (src.nb==null?'':src.nb) + '"></div>' +
    '<div class="fld"><label class="lbl">Boîte</label><input class="inp" id="f_boite" value="' + esc(src.boite) + '"></div></div>' +
    '<div class="fld"><label class="lbl">Séparateur</label><input class="inp" id="f_sep" value="' + esc(src.sep) + '"></div>' +
    hint +
    '<div class="shF"><button class="bS" id="x5">Annuler</button><button class="bP" id="k5">Ajouter à préparer</button></div>'
  );
  $('x5').onclick = closeSheet;
  $('k5').onclick = function(){
    var l = {
      id: nid(), poke: src.poke, nom: '',
      nb: parseInt($('f_nb').value,10) || null,
      boite: $('f_boite').value.trim(), sep: $('f_sep').value.trim(),
      st: 'afaire', pa: src.pa, pm: src.pm, pv: null,
      acheteur: '', notes: '', photo: null,
      dtCree: now(), dtPret: null, dtListe: null, dtVente: null, dtExp: null
    };
    closeSheet(); commit(l); toast('Nouveau lot à préparer');
  };
}

/* hashtags */
function buildTags(l){
  var p = (l && l.poke) ? l.poke.toLowerCase().replace(/[^a-z0-9àâäéèêëïîôöùûüç]/gi,'') : 'pokemon';
  return tagTpl.replace(/\{poke\}/g, p);
}
function copyTags(l){
  var t = buildTags(l);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ toast('Hashtags copiés'); },
      function(){ fallbackCopy(t); });
  } else fallbackCopy(t);
}
function fallbackCopy(t){
  var ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Hashtags copiés'); }catch(e){ toast('Copie impossible'); }
  document.body.removeChild(ta);
}
function sheetTags(){
  openSheet(
    '<div class="shT">Modèle de hashtags</div>' +
    '<div class="shS">Utilise <b>{poke}</b> — il sera remplacé par le Pokémon du lot.</div>' +
    '<div class="fld"><textarea class="inp" id="f_tpl" style="height:150px">' + esc(tagTpl) + '</textarea></div>' +
    '<div class="lbl" style="padding:0 18px 5px">Aperçu pour « Évoli »</div>' +
    '<div class="tagBox" id="tagPrev">' + esc(tagTpl.replace(/\{poke\}/g,'evoli')) + '</div>' +
    '<div class="shF"><button class="bS" id="x6">Fermer</button><button class="bP" id="k6">Enregistrer</button></div>'
  );
  $('f_tpl').oninput = function(){ $('tagPrev').textContent = this.value.replace(/\{poke\}/g,'evoli'); };
  $('x6').onclick = closeSheet;
  $('k6').onclick = function(){ tagTpl = $('f_tpl').value; closeSheet(); save(); toast('Modèle enregistré'); };
}

function sheetAcc(){
  openSheet(
    '<div class="shT">Cet appareil : ' + esc(WHOS[who] || '?') + '</div>' +
    '<div class="shS">' + esc((me && (me.name || me.email)) || '') + '</div>' +
    '<div class="fld"><div class="tagBox" style="margin:0">Fichier d\'écriture : <b>' + esc(myFile) + '</b><br>' +
    'Lots visibles : <b>' + lots.length + '</b><br>Version : <b>' + APP_VERSION + '</b><br><br>' +
    'Chaque appareil écrit dans son propre fichier Drive. Aucune modification ne peut écraser celle de l\'autre.</div></div>' +
    '<div class="fld"><label class="lbl">Changer d\'identité sur cet appareil</label><div style="display:flex;gap:9px">' +
    '<button class="aBtn ' + (who==='thomas'?'p':'') + '" style="flex:1;padding:10px" data-sw="thomas">Thomas</button>' +
    '<button class="aBtn ' + (who==='cindy'?'o':'') + '" style="flex:1;padding:10px" data-sw="cindy">Cindy</button>' +
    '</div></div>' +
    '<div class="shF"><button class="bS" id="x7">Fermer</button><button class="bP" id="k7r">Rafraîchir</button></div>' +
    '<button class="dgr" id="k7">Se déconnecter</button>'
  );
  var sw = document.querySelectorAll('[data-sw]');
  for(var i=0;i<sw.length;i++){
    sw[i].onclick = function(){
      var w = this.getAttribute('data-sw');
      if(w === who) return;
      who = w; localStorage.setItem('pks_who', w);
      savedLots = {}; myFileId = null;
      closeSheet(); boot(); toast('Identité : ' + WHOS[w]);
    };
  }
  $('x7').onclick = closeSheet;
  $('k7r').onclick = function(){ closeSheet(); sync(true); toast('Synchronisation…'); };
  $('k7').onclick = function(){
    confirmBox('Se déconnecter ?', 'Tes données restent sur Drive.', 'Déconnexion', function(){
      if(token) google.accounts.oauth2.revoke(token, function(){});
      try{ localStorage.removeItem('pks_tk'); }catch(e){}
      clearInterval(pollTimer);
      token = null; lots = []; savedLots = {};
      closeSheet(); closeCfm();
      $('app').classList.add('hide'); $('auth').classList.remove('hide');
    });
  };
}

/* ═══ EVENTS ═══ */
document.addEventListener('click', function(e){
  var bp = e.target.closest('[data-boxpick]');
  if(bp){
    if(boxFilter !== null){ boxFilter = null; render(); }
    else sheetBoxes();
    return;
  }
  var s = e.target.closest('[data-sort]');
  if(s){
    var k = s.getAttribute('data-sort');
    if(k === sortKey) sortDir = -sortDir;
    else { sortKey = k; sortDir = (k === 'alpha') ? 1 : -1; }
    try{ localStorage.setItem('pks_sort', JSON.stringify({ k: sortKey, d: sortDir })); }catch(err){}
    render();
    return;
  }
  var t = e.target.closest('[data-open],[data-mv],[data-list],[data-sell],[data-again],[data-tag],[data-ship]');
  if(!t) return;
  var v;
  if((v = t.getAttribute('data-open'))){ sheetEdit(v); return; }
  if((v = t.getAttribute('data-list'))){ sheetList(v); return; }
  if((v = t.getAttribute('data-sell'))){ sheetSell(v); return; }
  if((v = t.getAttribute('data-again'))){ sheetAgain(v); return; }
  if((v = t.getAttribute('data-tag'))){
    var lt = lots.filter(function(x){ return x.id === v; })[0];
    if(lt) copyTags(lt);
    return;
  }
  if((v = t.getAttribute('data-mv'))){
    var p = v.split('|'), l = lots.filter(function(x){ return x.id === p[0]; })[0];
    if(!l) return;
    l.st = p[1];
    if(p[1] === 'pret') l.dtPret = now();
    if(p[1] === 'expedie') l.dtExp = now();
    commit(l);
    toast(p[1] === 'pret' ? 'Lot prêt' : 'Marqué expédié');
    return;
  }
  if((v = t.getAttribute('data-ship'))){
    var ids = v.split(',');
    for(var i=0;i<ids.length;i++){
      var ll = lots.filter(function(x){ return x.id === ids[i]; })[0];
      if(ll){ ll.st = 'expedie'; ll.dtExp = now(); commit(ll); }
    }
    toast('Commande expédiée');
    return;
  }
});

$('q').oninput = render;
$('qClr').onclick = function(){ $('q').value = ''; $('q').blur(); render(); };
$('fab').onclick = function(){ if(tab === 'afaire' && !query()) sheetQuick(); else sheetNew(); };
$('btnTags').onclick = sheetTags;
$('btnAcc').onclick = sheetAcc;
$('btnSignin').onclick = signIn;
$('ovl').onclick = function(e){ if(e.target === $('ovl')) closeSheet(); };
$('lbX').onclick = closeLightbox;
$('lb').onclick = function(e){ if(e.target !== $('lbX')) closeLightbox(); };
$('cfmN').onclick = closeCfm;

/* back Android : ferme les feuilles avant de quitter */
history.replaceState({ d:0 }, '');
window.addEventListener('popstate', function(){
  if($('lb').classList.contains('on')){ $('lb').classList.remove('on'); return; }
  if($('cfm').classList.contains('on')){ closeCfm(); history.pushState({d:1},''); return; }
  if(sheetOpen){ closeSheet(); history.pushState({d:1},''); return; }
  if(query()){ $('q').value = ''; render(); history.pushState({d:1},''); return; }
});
var _open = openSheet;
openSheet = function(h){ _open(h); history.pushState({ d:1 }, ''); };

document.addEventListener('visibilitychange', function(){
  if(!document.hidden && token && !sheetOpen) sync(false);
});

/* ═══ BOOT ═══ */
window.addEventListener('load', function(){
  var s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.onload = function(){
    initGis();
    try{
      var st = JSON.parse(localStorage.getItem('pks_tk') || 'null');
      if(st && st.t && st.e > Date.now() + 60000){
        token = st.t; tokenExp = st.e; start();
      }
    }catch(e){}
  };
  document.head.appendChild(s);
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
});
</script>
