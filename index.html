function stkVars(c){
  var m = (stkOv[c.i] != null) ? stkOv[c.i] : c.v, r = [];
  if(m & 1) r.push('n');
  if(m & 2) r.push('r');
  if(m & 4) r.push('h');
  return r.length ? r : ['n'];
}

/* ---- base de cartes : liste des extensions d'abord, cartes a la demande ---- */
var setCards = {}, nameIdx = null, cdbP = null, nameP = null, setP = {};

function jgetv(u, v){ return fetch(u + '?v=' + v).then(function(r){
  if(!r.ok) throw new Error('http ' + r.status); return r.json(); }); }
function jget(u){ return jgetv(u, CARDS_VER); }

/* sous-extensions (Galeries des Dresseurs, Galerie de Galar, coffres brillants) :
   pokemontcg.io en fait des extensions a part, alors qu'elles sont physiquement
   rangees avec leur extension parente. On les fusionne a l'affichage. */
function subsOf(sid){
  var r = [];
  if(!cdb) return r;
  for(var i=0;i<cdb.sets.length;i++) if(cdb.sets[i].parent === sid) r.push(cdb.sets[i].id);
  return r;
}
function rootSet(sid){
  var s = setInfo(sid);
  return (s && s.parent) ? s.parent : sid;
}

function cdbLoad(){
  if(cdbP) return cdbP;
  cdbP = jgetv('./pks_sets.json', SETS_VER).then(function(j){
    cdb = j; cdbById = {};
    return j;
  }).catch(function(e){ cdbP = null; toast('Liste des extensions introuvable'); throw e; });
  return cdbP;
}
function setLoad(sid){
  if(setCards[sid]) return Promise.resolve(setCards[sid]);
  if(setP[sid]) return setP[sid];
  setP[sid] = jget('./cards/' + sid + '.json').then(function(arr){
    setCards[sid] = arr;
    for(var i=0;i<arr.length;i++) cdbById[arr[i].i] = arr[i];
    delete setP[sid];
    return arr;
  }).catch(function(e){ delete setP[sid]; toast('Extension indisponible'); throw e; });
  return setP[sid];
}
function namesLoad(){
  if(nameIdx) return Promise.resolve(nameIdx);
  if(nameP) return nameP;
  nameP = jget('./pks_names.json').then(function(j){ nameIdx = j; return j; })
    .catch(function(e){ nameP = null; toast('Index de recherche indisponible'); throw e; });
  return nameP;
}
function setInfo(sid){
  if(!cdb) return null;
  for(var i=0;i<cdb.sets.length;i++) if(cdb.sets[i].id === sid) return cdb.sets[i];
  return null;
}
/* depuis Ecarlate et Violet, le symbole de l'extension porte deja son abreviation :
   inutile de la repeter a cote du nom */
var SYM_HAS_CODE = { 'Écarlate et Violet':1, 'Méga-Évolution':1 };
function codeHtml(st){
  if(!st || !st.code) return '';
  if(SYM_HAS_CODE[st.serie] || (st.date && st.date >= '2023-03-31')) return '';
  return '<span class="scode">' + esc(st.code) + '</span>';
}
/* symbole d'extension : essaie les sources dans l'ordre, pokemontcg.io en dernier */
function symHtml(st, cls){
  var l = st.syms || [];
  if(!l.length) return '<span class="sfb ' + (cls||'') + '">' + esc((st.code || '?').slice(0,3)) + '</span>';
  return '<img class="ssym ' + (cls||'') + '" loading="lazy" src="' + esc(l[0]) + '" alt="" ' +
         'data-sy="' + esc(JSON.stringify(l)) + '" data-syi="0" data-code="' + esc(st.code || '') + '" onerror="symNext(this)">';
}
function symNext(img){
  var l; try{ l = JSON.parse(img.getAttribute('data-sy')); }catch(e){ l = []; }
  var i = parseInt(img.getAttribute('data-syi'), 10) + 1;
  if(i < l.length){ img.setAttribute('data-syi', i); img.src = l[i]; return; }
  var fb = document.createElement('span');
  fb.className = 'sfb';
  fb.textContent = (img.getAttribute('data-code') || '?').slice(0,3);
  img.replaceWith(fb);
}
/* Visuels de cartes : chaine de sources.
   TCGdex d'abord quand la base le fournit, puis pokemontcg.io, qui couvre
   les sous-extensions (Galeries des Dresseurs, coffres brillants) pour
   lesquelles la base n'a aucune URL. */
function ptcgImg(c, big){
  if(!c || !c.s || c.u == null) return '';
  return 'https://images.pokemontcg.io/' + c.s + '/' + c.u + (big ? '_hires' : '') + '.png';
}
function cardSrcs(c, big){
  var l = [];
  if(c.g) l.push(c.g + (big ? '/high.webp' : '/low.webp'));
  if(c.g && big) l.push(c.g + '/low.webp');
  var pt = ptcgImg(c, big);
  if(pt) l.push(pt);
  if(big){ var pl = ptcgImg(c, false); if(pl) l.push(pl); }
  return l;
}
function cdbImg(c){ return cardSrcs(c, false)[0] || ''; }
function cdbImgBig(c){ return cardSrcs(c, true)[0] || ''; }

/* balise image a sources multiples : passe a la suivante en cas d'echec */
function cardImg(c, cls, big){
  var l = cardSrcs(c, big);
  if(!l.length) return '<span class="' + (cls || '') + '"></span>';
  return '<img class="' + (cls || '') + '" loading="lazy" src="' + esc(l[0]) + '" alt="" ' +
         'data-cs="' + esc(JSON.stringify(l)) + '" data-ci="0" onerror="cardImgErr(this)">';
}
function cardImgErr(img){
  var l; try{ l = JSON.parse(img.getAttribute('data-cs') || '[]'); }catch(e){ l = []; }
  var i = parseInt(img.getAttribute('data-ci') || '0', 10) + 1;
  if(i < l.length){ img.setAttribute('data-ci', i); img.src = l[i]; return; }
  img.classList.add('gone');
  img.style.visibility = 'hidden';
}


/* ---- persistance Drive ---- */
async function stkFind(){
  var url = 'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&pageSize=50&fields=files(id,name)&q=' +
    encodeURIComponent("name = '" + STK_FILE + "' and trashed=false");
  var r = await api(url);
  var j = await r.json();
  return (j.files && j.files[0]) ? j.files[0].id : null;
}
function stkApply(data){
  stock = (data && data.stock) || {};
  stkOv = (data && data.ov) || {};
  stkDone = (data && data.done) || {};
  for(var dk in doneDirty){ stkDone[dk] = doneDirty[dk]; }   /* nos marquages priment sur le distant */
  stkRev = (data && data.rev) || 0;
  mvCount = (data && data.mvCount) || 0;
  stkBaseRev = stkRev;
  /* migration : un ancien fichier porte encore le journal, on le bascule */
  if(data && data.moves && data.moves.length){
    mvNew = data.moves.concat(mvNew);
    mvCount = Math.max(mvCount, data.moves.length);
    mvQueue();
  }
}
/* Cache local du stock : evite d'attendre Drive au premier acces a l'onglet.
   L'identifiant du fichier est memorise aussi, ce qui supprime la requete
   de recherche et donc un aller-retour complet. */
function stkSaveCache(){
  try{
    localStorage.setItem(LS + 'stkc', JSON.stringify({
      rev: stkRev, stock: stock, ov: stkOv, done: stkDone, mvCount: mvCount, id: stkFileId
    }));
  }catch(e){ /* quota plein : on s'en passe */ }
}
function stkLoadCache(){
  try{
    var c = JSON.parse(localStorage.getItem(LS + 'stkc') || 'null');
    if(!c) return false;
    if(c.id) stkFileId = c.id;
    stock = c.stock || {};
    stkOv = c.ov || {};
    stkDone = c.done || {};
    mvCount = c.mvCount || 0;
    stkRev = c.rev || 0;
    stkBaseRev = stkRev;
    return true;
  }catch(e){ return false; }
}

async function stkLoad(){
  if(stkNet) return;                        /* deja lu depuis Drive */
  var vuEnCache = stkLoaded ? true : stkLoadCache();
  if(vuEnCache) stkLoaded = true;           /* affichage immediat, rafraichi juste apres */
  if(!tokenValid()) return;                 /* pas de jeton : on retentera plus tard */
  async function lire(id){
    var r = await api('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media');
    if(!r.ok) throw new Error('http ' + r.status);
    return await r.json();
  }
  try{
    var data = null;
    if(stkFileId){
      /* identifiant memorise : peut etre perime si le fichier a ete recree */
      try{ data = await lire(stkFileId); }
      catch(e1){ stkFileId = null; }
    }
    if(data === null){
      stkFileId = await stkFind();
      if(stkFileId) data = await lire(stkFileId);
    }
    if(data){
      /* ne pas ecraser des gestes faits pendant le chargement */
      if(!stkPending.length) stkApply(data);
      stkSaveCache();
      if(vuEnCache && tab === 'stock') render();
      stkNet = true;
    }
    stkLoaded = true;
  }catch(e){
    if(!vuEnCache) toast('Stock : lecture impossible');
  }
}
function stkBody(){
  return JSON.stringify({ rev: stkRev, stock: stock, ov: stkOv, done: stkDone, mvCount: mvCount, at: now(), v: APP_VERSION });
}
async function stkWrite(){
  var meta = { name: STK_FILE, parents: ['appDataFolder'] };
  var fd = new FormData();
  if(!stkFileId){
    fd.append('metadata', new Blob([JSON.stringify(meta)], { type:'application/json' }));
    fd.append('file', new Blob([stkBody()], { type:'application/json' }));
    var r = await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method:'POST', body: fd });
    stkFileId = (await r.json()).id;
  } else {
    await api('https://www.googleapis.com/upload/drive/v3/files/' + stkFileId + '?uploadType=media', {
      method:'PATCH', headers:{ 'Content-Type':'application/json' }, body: stkBody()
    });
  }
}
/* garde-fou : si le fichier a bougé ailleurs, on rejoue nos mouvements dessus */
async function stkSave(){
  if(stkSaving || !stkPending.length) return;
  stkSaving = true; setSync('busy');
  try{
    if(stkFileId){
      var r = await api('https://www.googleapis.com/drive/v3/files/' + stkFileId + '?alt=media');
      var rem = await r.json().catch(function(){ return null; });
      if(rem && (rem.rev || 0) !== stkBaseRev){
        var mine = stkPending.slice();
        stkApply(rem);
        for(var i=0;i<mine.length;i++){
          var m = mine[i], k = stkKey(m.c, m.v, m.e);
          stock[k] = Math.max(0, (stock[k] || 0) + m.d);
          stkMoves.push(m);
        }
        toast('Stock fusionné avec l\'autre appareil');
      }
    }
    stkRev = stkBaseRev + 1;
    await stkWrite();
    stkBaseRev = stkRev;
    stkPending = [];
    doneDirty = {};
    stkSaveCache();
    setSync('ok');
  }catch(e){ setSync('err'); toast('Stock non sauvegardé'); }
  stkSaving = false;
  if(stkPending.length) stkQueue();
}
function stkQueue(){ clearTimeout(stkTimer); stkTimer = setTimeout(stkSave, 2500); }

/* ---- journal : fichier separe, ecrit plus rarement ---- */
async function mvFind(){
  var url = 'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&pageSize=10&fields=files(id,name)&q=' +
    encodeURIComponent("name = '" + MV_FILE + "' and trashed=false");
  var r = await api(url);
  var j = await r.json();
  return (j.files && j.files[0]) ? j.files[0].id : null;
}
async function mvLoad(){
  if(mvLoaded) return stkMoves;
  var base = [];
  try{
    if(!mvFileId) mvFileId = await mvFind();
    if(mvFileId){
      var r = await api('https://www.googleapis.com/drive/v3/files/' + mvFileId + '?alt=media');
      var j = await r.json();
      base = (j && j.moves) || [];
    }
  }catch(e){ toast('Journal : lecture impossible'); }
  /* mvNew contient ce qui n'est pas encore ecrit : eviter de le compter deux fois */
  var seen = {};
  for(var i=0;i<base.length;i++) seen[base[i].t + '|' + base[i].c + '|' + base[i].d] = 1;
  var add = mvNew.filter(function(m){ return !seen[m.t + '|' + m.c + '|' + m.d]; });
  stkMoves = base.concat(add);
  stkMoves.sort(function(a, b){ return a.t - b.t; });
  mvCount = Math.max(mvCount, stkMoves.length);
  mvLoaded = true;
  return stkMoves;
}
async function mvSave(){
  if(mvSaving || !mvNew.length) return;
  mvSaving = true;
  var envoi = mvNew.slice();
  try{
    if(!mvFileId) mvFileId = await mvFind();
    var base = [];
    if(mvFileId){
      try{
        var r = await api('https://www.googleapis.com/drive/v3/files/' + mvFileId + '?alt=media');
        var j = await r.json();
        base = (j && j.moves) || [];
      }catch(e){ base = []; }
    }
    var seen = {};
    for(var i=0;i<base.length;i++) seen[base[i].t + '|' + base[i].c + '|' + base[i].d] = 1;
    for(var k=0;k<envoi.length;k++){
      var key = envoi[k].t + '|' + envoi[k].c + '|' + envoi[k].d;
      if(!seen[key]){ base.push(envoi[k]); seen[key] = 1; }
    }
    base.sort(function(a, b){ return a.t - b.t; });
    if(base.length > MV_CAP) base = base.slice(-MV_CAP);
    var body = JSON.stringify({ moves: base, at: now(), v: APP_VERSION });
    if(!mvFileId){
      var fd = new FormData();
      fd.append('metadata', new Blob([JSON.stringify({ name: MV_FILE, parents: ['appDataFolder'] })], { type:'application/json' }));
      fd.append('file', new Blob([body], { type:'application/json' }));
      var rr = await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method:'POST', body: fd });
      mvFileId = (await rr.json()).id;
    } else {
      await api('https://www.googleapis.com/upload/drive/v3/files/' + mvFileId + '?uploadType=media', {
        method:'PATCH', headers:{ 'Content-Type':'application/json' }, body: body
      });
    }
    mvNew = mvNew.slice(envoi.length);
    mvCount = base.length + mvNew.length;
    if(mvLoaded){ stkMoves = base.concat(mvNew); }
  }catch(e){ /* on retentera : mvNew est conserve */ }
  mvSaving = false;
  if(mvNew.length) mvQueue();
}
function mvQueue(){ clearTimeout(mvTimer); mvTimer = setTimeout(mvSave, 20000); }

function stkAdd(id, v, e, d, src){
  var k = stkKey(id, v, e), cur = stock[k] || 0, nv = Math.max(0, cur + d);
  if(nv === cur) return false;
  stock[k] = nv;
  if(!nv) delete stock[k];
  var mv = { t: now(), c: id, v: v, e: e, d: nv - cur, w: who || '', s: src || 'saisie' };
  stkPending.push(mv);
  mvNew.push(mv); mvCount++;
  if(mvLoaded) stkMoves.push(mv);
  stkQueue(); mvQueue(); stkSaveCache();
  return true;
}
function stkSetOv(id, mask){
  if(mask) stkOv[id] = mask; else delete stkOv[id];
  stkQueue();
}

/* ---- rendu ---- */
/* prechargement silencieux, declenche au demarrage */
var stkPreloaded = false;
/* ═══ MISE A JOUR ═══
   En PWA installee il n'y a pas de bouton de rechargement, et un service
   worker recalcitrant laisse l'utilisateur bloque sur une ancienne version
   sans aucun recours. On verifie donc nous-memes, en contournant tous les
   caches, et on propose un rechargement explicite. */
var majVue = null;

async function checkUpdate(){
  try{
    var r = await fetch('./index.html?_=' + Date.now(), { cache: 'no-store' });
    if(!r.ok) return;
    var t = await r.text();
    var m = t.match(/APP_VERSION\s*=\s*'([^']+)'/);
    if(!m) return;
    if(m[1] !== APP_VERSION && m[1] !== majVue) showMaj(m[1]);
  }catch(e){}
}

function showMaj(v){
  majVue = v;
  if(document.getElementById('majBar')) return;
  var d = document.createElement('div');
  d.className = 'majBar';
  d.id = 'majBar';
  d.innerHTML = '<span>Version <b>' + v + '</b> disponible</span>' +
                '<button class="mj" id="majGo">Recharger</button>' +
                '<button class="mx" id="majNo" aria-label="Plus tard">×</button>';
  document.body.appendChild(d);
  document.getElementById('majNo').onclick = function(){ d.remove(); };
  document.getElementById('majGo').onclick = hardReload;
}

/* purge le cache de la coquille puis recharge : les caches d'images et de
   donnees de cartes sont conserves, inutile de les retelecharger */
async function hardReload(){
  var b = document.getElementById('majGo');
  if(b){ b.textContent = '…'; b.disabled = true; }
  try{
    var keys = await caches.keys();
    await Promise.all(keys.filter(function(k){ return k.indexOf('-v') > 0; })
                          .map(function(k){ return caches.delete(k); }));
  }catch(e){}
  try{
    var reg = await navigator.serviceWorker.getRegistration();
    if(reg){ await reg.update(); if(reg.waiting) reg.waiting.postMessage('skipWaiting'); }
  }catch(e){}
  location.replace(location.pathname + '?maj=' + Date.now());
}

function stkPreload(){
  if(stkPreloaded) return;
  cdbLoad().catch(function(){});
  /* sans jeton valide la lecture Drive echouerait sans nouvelle tentative :
     on repousse jusqu'a ce que l'authentification aboutisse */
  if(!tokenValid()){ setTimeout(stkPreload, 2000); return; }
  stkPreloaded = true;
  stkLoad().catch(function(){});
}

async function renderStock(){
  if(!cdb){
    /* le prechargement est probablement deja en cours : on l'attend brievement
       avant d'afficher un message, pour ne pas faire clignoter l'ecran */
    var p = cdbLoad().catch(function(){ return null; });
    var vite = await Promise.race([p, new Promise(function(r){ setTimeout(function(){ r('lent'); }, 250); })]);
    if(vite === 'lent' && !cdb){
      $('view').innerHTML = '<div class="ph">Chargement des extensions…</div>';
      try{ await p; }catch(e){}
    }
    if(!cdb){ $('view').innerHTML = empty(EMPTY_CMD, 'Liste des extensions indisponible.'); return; }
  }
  if(!stkLoaded) await stkLoad();
  if(stkNever) return stkRenderNever();
  if(stkInv) return stkRenderInv();
  if(stkJournal) return stkRenderJournal();
  if(stkSet) return stkRenderGrid();      /* la recherche se fait dans l'extension */
  var q = query();
  if(q) return stkRenderSearch(q);
  stkRenderSets();
}

function stkRenderSets(){
  var tot = 0, uniq = 0;
  for(var k in stock){ tot += stock[k]; uniq++; }
  var per = {};
  for(var k2 in stock){
    var p = k2.split('|')[0], dash = p.lastIndexOf('-');
    var sid = dash > 0 ? p.slice(0, dash) : p;
    per[sid] = (per[sid] || 0) + stock[k2];
  }
  var h = '<div class="stkTot">' +
          '<div class="cell" data-stkinv="1"><span class="go">›</span>' +
          '<span>Exemplaires</span><b>' + tot + '</b></div>' +
          '<div class="cell" data-stknv="1"><span class="go">›</span>' +
          '<span>Jamais fait</span><b id="nvCount">—</b></div></div>';
  h += '<div class="stkJB" data-stkj="1">' +
       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
       '<path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>' +
       'Mouvements de stock<span class="jc">' + (mvLoaded ? stkMoves.length : mvCount) + '</span></div>';
  /* reporter le stock des sous-extensions sur leur parent */
  for(var sk in per){
    var rt = rootSet(sk);
    if(rt !== sk){ per[rt] = (per[rt] || 0) + per[sk]; per[sk] = 0; }
  }
  var cur = null;
  for(var i=0;i<cdb.sets.length;i++){
    var st = cdb.sets[i];
    if(st.parent) continue;                 /* fusionnee dans son parent */
    var n = per[st.id] || 0;
    if(st.serie !== cur){ cur = st.serie; h += '<div class="stkSerie">' + esc(cur) + '</div>'; }
    h += '<div class="stkSet" data-stkset="' + esc(st.id) + '">' + symHtml(st) +
         '<div class="sinfo"><b>' + esc(st.name) + '</b>' + codeHtml(st) + '</div>' +
         '<span class="sc' + (n ? '' : ' z') + '">' + (n ? n : '—') + '</span></div>';
  }
  $('view').innerHTML = h;
  nvCountFill();
}

function cmHtml(c){
  return '<button class="cmk" data-cm="' + esc(c.n) + '|' + esc(c.u) + '" aria-label="Voir sur Cardmarket">' +
         '<img src="' + CM_LOGO + '" alt=""></button>';

function openCM(nom, num){
  var q = encodeURIComponent((nom + ' ' + (num || '')).trim());
  window.open('https://www.cardmarket.com/fr/Pokemon/Products/Search?searchString=' + q +
              '&language=2&minCondition=2', '_blank');
}

function stkChips(c){
  var vs = stkVars(c), solo = vs.length === 1, out = '';
  for(var i=0;i<vs.length;i++){
    var q = stkVarQ(c.i, vs[i]);
    out += '<div class="stkV ' + (q ? 'on' : 'q0') + (solo ? ' solo' : '') + '" data-stkv="' + esc(c.i) + '|' + vs[i] + '">' +
           (solo ? '' : '<span class="vl">' + VAR_LBL[vs[i]] + '</span>') +
           '<span class="vq">' + q + '</span></div>';
  }
  return out;
}
function stkTile(c){
  var vs = stkVars(c), h = '';
  h += '<div class="stkC' + (stkCardQ(c.i) ? ' has' : '') + '" data-stkid="' + esc(c.i) + '">';
  h += '<div class="im">' + cardImg(c, '') +
       '<span class="nu">' + esc(c.u) + '</span>' + (c.d ? '<span class="stkDot" title="variante déduite"></span>' : '') +
       rarHtml(c) + cmHtml(c) + '</div>';
  h += '<div class="na">' + esc(c.n) + '</div><div class="vs">' + stkChips(c);
  return h + '</div></div>';
}

async function stkRenderGrid(){
  var s = setInfo(stkSet), sid = stkSet;
  var ico = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>';
  function head(sub){
    return '<div class="stkBar"><button class="stkBack" data-stkback="1" aria-label="Retour">' + ico + '</button>' +
           '<div class="stkTit"><span class="th">' + (s ? symHtml(s) : '') + esc(s ? s.name : sid) +
           codeHtml(s) + '</span>' +
           '<small>' + sub + '</small></div></div>';
  }
  var parts = [sid].concat(subsOf(sid));
  var todo = parts.filter(function(x){ return !setCards[x]; });
  if(todo.length){
    $('view').innerHTML = head('chargement…') + '<div class="ph">Chargement des cartes…</div>';
    try{ await Promise.all(todo.map(setLoad)); }
    catch(e){ $('view').innerHTML = head('erreur') + empty(EMPTY_CMD, 'Cartes indisponibles.'); return; }
    if(stkSet !== sid || tab !== 'stock' || query()) return;   /* l'utilisateur est parti entre-temps */
  }
  var arr = [];
  for(var pi=0;pi<parts.length;pi++) arr = arr.concat(setCards[parts[pi]] || []);
  var tot = 0, poss = 0;
  for(var j=0;j<arr.length;j++){ var q = stkCardQ(arr[j].i); tot += q; if(q) poss++; }

  stkArr = arr;

  function seg(attr, val, cur, lbl){
    return '<button class="' + (cur === val ? 'on' : '') + '" data-' + attr + '="' + val + '">' + lbl + '</button>';
  }
  var bar = '<div class="stkFB"><div class="sg">' +
    seg('stkf','all',stkFilt,'Toutes') + seg('stkf','has',stkFilt,'J\'en ai') + seg('stkf','none',stkFilt,'Manquantes') +
    '</div><div class="sg">' +
    seg('stkt','num',stkTri,'N°') + seg('stkt','qty',stkTri,'Quantité') +
    '</div></div>';

  var srch = '<div class="stkSrch"><input type="search" id="stkq" placeholder="Chercher dans cette extension…"' + noAuto() + ' value="' + esc(stkQry) + '">' +
             (stkQry ? '<button class="sx" id="stkqx" aria-label="Effacer">×</button>' : '') + '</div>';

  var sub = arr.length + ' cartes · ' + poss + ' possédées · ' + tot + ' en stock';
  $('view').innerHTML = head(sub) + srch + bar + '<div id="stkgrid"></div>';
  stkGridFill();

  var inp = $('stkq');
  if(inp){
    inp.oninput = function(){
      clearTimeout(inp._t);
      inp._t = setTimeout(function(){
        stkQry = inp.value;
        stkGridFill();
        var x = $('stkqx');
        if(stkQry && !x){
          var b = document.createElement('button');
          b.className = 'sx'; b.id = 'stkqx'; b.textContent = '×';
          b.onclick = stkClearQ;
          inp.parentNode.appendChild(b);
        } else if(!stkQry && x) x.remove();
      }, 200);
    };
  }
  if($('stkqx')) $('stkqx').onclick = stkClearQ;
}

function stkClearQ(){
  stkQry = '';
  var i = $('stkq');
  if(i) i.value = '';
  var x = $('stkqx');
  if(x) x.remove();
  stkGridFill();
  if(i) i.focus();
}

/* recalcule uniquement la grille : le champ de recherche garde le focus */
function stkGridFill(){
  var g = $('stkgrid');
  if(!g) return;
  var vue = stkArr;
  if(stkFilt === 'has')  vue = vue.filter(function(c){ return stkCardQ(c.i) > 0; });
  if(stkFilt === 'none') vue = vue.filter(function(c){ return stkCardQ(c.i) === 0; });

  var q = norm(stkQry || '');
  if(q){
    vue = vue.filter(function(c){
      return norm(c.n).indexOf(q) >= 0 || norm(c.e).indexOf(q) >= 0 ||
             String(c.u).toLowerCase().indexOf(stkQry.trim().toLowerCase()) === 0;
    });
  }
  if(stkTri === 'qty'){
    vue = vue.slice().sort(function(a, b){
      return (stkCardQ(b.i) - stkCardQ(a.i)) || (stkArr.indexOf(a) - stkArr.indexOf(b));
    });
  }
  if(!vue.length){
    g.innerHTML = '<div class="pkE">' +
      (q ? 'Aucune carte ne correspond dans cette extension.'
         : (stkFilt === 'has' ? 'Aucune carte saisie dans cette extension.'
                              : 'Tu as toutes les cartes de cette extension.')) + '</div>';
    return;
  }
  var h = '<div class="stkGrid">';
  for(var k=0;k<vue.length;k++) h += stkTile(vue[k]);
  g.innerHTML = h + '</div>';
}

async function stkRenderSearch(q){
  var n = norm(q);
  if(n.length < 2){ $('view').innerHTML = '<div class="ph">Tape au moins deux lettres.</div>'; return; }
  if(!nameIdx){
    $('view').innerHTML = '<div class="ph">Chargement de l\'index…</div>';
    try{ await namesLoad(); }catch(e){ $('view').innerHTML = empty(EMPTY_CMD, 'Recherche indisponible.'); return; }
    if(norm(query()) !== n || tab !== 'stock') return;
  }
  var ids = [];
  for(var nm in nameIdx){ if(nm.indexOf(n) >= 0){ ids = ids.concat(nameIdx[nm]); if(ids.length > 900) break; } }
  if(!ids.length){ $('view').innerHTML = noHit(EMPTY_CMD, 'ce Pokémon'); return; }

  /* ne charger que les extensions reellement concernees */
  var need = {}, sids = [];
  for(var i=0;i<ids.length;i++){
    var d2 = ids[i].lastIndexOf('-'), sid = d2 > 0 ? ids[i].slice(0, d2) : ids[i];
    if(!need[sid]){ need[sid] = 1; sids.push(sid); }
  }
  var missing = sids.filter(function(s){ return !setCards[s]; });
  if(missing.length){
    $('view').innerHTML = '<div class="ph">Recherche dans ' + sids.length + ' extensions…</div>';
    try{ await Promise.all(missing.map(setLoad)); }catch(e){}
    if(norm(query()) !== n || tab !== 'stock') return;
  }

  var cards = [];
  for(var j=0;j<ids.length;j++){ var c = cdbById[ids[j]]; if(c) cards.push(c); }
  var withQ = cards.filter(function(c){ return stkCardQ(c.i) > 0; });
  var LIM = 400, coupe = cards.length > LIM;
  var show = cards.slice(0, LIM);          /* toujours tout, possede ou non */
  if(!show.length){ $('view').innerHTML = noHit(EMPTY_CMD, 'ce Pokémon'); return; }

  var order = [], grp = {};
  for(var m=0;m<cdb.sets.length;m++) if(!cdb.sets[m].parent) order.push(cdb.sets[m].id);
  for(var p=0;p<show.length;p++){
    var rs = rootSet(show[p].s);
    (grp[rs] = grp[rs] || []).push(show[p]);
  }
  var tot = 0;
  for(var t=0;t<withQ.length;t++) tot += stkCardQ(withQ[t].i);

  var h;
  if(withQ.length){
    h = '<div class="stkTot">' +
        '<div><span>Trouvées</span><b>' + show.length + '</b></div>' +
        '<div><span>J\'en ai</span><b>' + withQ.length + '</b></div>' +
        '<div><span>Exempl.</span><b>' + tot + '</b></div>' +
        '<div><span>Extensions</span><b>' + Object.keys(grp).length + '</b></div></div>';
  } else {
    h = '<div class="stkTot">' +
        '<div><span>Cartes trouvées</span><b>' + show.length + '</b></div>' +
        '<div><span>Extensions</span><b>' + Object.keys(grp).length + '</b></div></div>';
    h += '<div class="stkWarn">Aucun exemplaire en stock pour ce nom.</div>';
  }
  if(coupe) h += '<div class="stkWarn">' + cards.length + ' cartes correspondent, seules les ' + LIM + ' premières sont affichées. Affine la recherche.</div>';
  for(var o=0;o<order.length;o++){
    var a = grp[order[o]];
    if(!a) continue;
    var si = setInfo(order[o]);
    var sc = si && si.code && !(SYM_HAS_CODE[si.serie] || (si.date && si.date >= '2023-03-31'));
    h += '<div class="stkSerie">' + esc(si ? si.name : order[o]) + (sc ? ' · ' + esc(si.code) : '') + '</div>';
    for(var z=0;z<a.length;z++){
      var c2 = a[z], vs = stkVars(c2), det = [];
      for(var v=0;v<vs.length;v++){
        var qq = stkVarQ(c2.i, vs[v]);
        if(qq) det.push(vs.length === 1 ? ('×' + qq) : (VAR_FULL[vs[v]] + ' ×' + qq));
      }
      h += '<div class="stkRow" data-stkid="' + esc(c2.i) + '">' +
           cardImg(c2, '') +
           '<div class="rt"><b>' + esc(c2.n) + '</b><small>N° ' + esc(c2.u) + (det.length ? ' · ' + esc(det.join(' · ')) : '') + '</small>' +
           '<div class="rvs">' + stkChips(c2) + '</div></div>' +
           '<div class="rq">' + stkCardQ(c2.i) + '</div></div>';
    }
  }
  $('view').innerHTML = h;
}

/* ---- inventaire complet : toutes les cartes possedees ---- */
async function stkRenderInv(){
  var ico = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>';
  function head(sub){
    return '<div class="stkBar"><button class="stkBack" data-stkib="1" aria-label="Retour">' + ico + '</button>' +
           '<div class="stkTit">Tout mon stock<small>' + sub + '</small></div></div>';
  }
  var ids = {}, tot = 0;
  for(var k in stock){
    if(!stock[k]) continue;
    ids[k.split('|')[0]] = 1;
    tot += stock[k];
  }
  var keys = Object.keys(ids);
  if(!keys.length){
    $('view').innerHTML = head('vide') + '<div class="pkE">Aucune carte en stock pour l\'instant.</div>';
    return;
  }

  $('view').innerHTML = head('chargement…');
  try{ await ensureCards(keys); }catch(e){}
  if(!stkInv || tab !== 'stock') return;

  var cards = [];
  for(var i=0;i<keys.length;i++){ var c = cdbById[keys[i]]; if(c) cards.push(c); }

  var fl = (invDir === 1 ? ' ↑' : ' ↓');
  var bar = '<div class="stkFB"><div class="sg">' +
    '<button class="' + (stkTri === 'num' ? 'on' : '') + '" data-stkt="num">Par extension</button>' +
    '<button class="' + (stkTri === 'qty' ? 'on' : '') + '" data-stkt="qty">Par quantité' + (stkTri === 'qty' ? fl : '') + '</button>' +
    '</div></div>';

  var h = head(cards.length + ' cartes différentes · ' + tot + ' exemplaires') + bar;

  if(stkTri === 'qty'){
    cards.sort(function(a, b){
      return invDir * (stkCardQ(a.i) - stkCardQ(b.i)) || a.n.localeCompare(b.n, 'fr');
    });
    h += invRows(cards);
  } else {
    var grp = {};
    for(var j=0;j<cards.length;j++){
      var rs = rootSet(cards[j].s);
      (grp[rs] = grp[rs] || []).push(cards[j]);
    }
    for(var s=0;s<cdb.sets.length;s++){
      var sid = cdb.sets[s].id, a = grp[sid];
      if(cdb.sets[s].parent || !a) continue;
      var st = 0;
      for(var q=0;q<a.length;q++) st += stkCardQ(a[q].i);
      h += '<div class="stkSerie">' + esc(cdb.sets[s].name) + ' · ' + st + '</div>' + invRows(a);
    }
  }
  $('view').innerHTML = h;
}

function invRows(arr){
  var h = '';
  for(var z=0;z<arr.length;z++){
    var c = arr[z], vs = stkVars(c), det = [];
    for(var v=0;v<vs.length;v++){
      var qq = stkVarQ(c.i, vs[v]);
      if(qq) det.push(vs.length === 1 ? ('×' + qq) : (VAR_FULL[vs[v]] + ' ×' + qq));
    }
    h += '<div class="stkRow" data-stkid="' + esc(c.i) + '">' + cardImg(c, '') +
         '<div class="rt"><b>' + esc(c.n) + '</b><small>N° ' + esc(c.u) +
         (det.length ? ' · ' + esc(det.join(' · ')) : '') + '</small>' +
         '<div class="rvs">' + stkChips(c) + '</div></div>' +
         '<div class="rq">' + stkCardQ(c.i) + '</div></div>';
  }
  return h;
}

/* Le compte des Pokemon jamais faits a besoin des noms de cartes, donc des
   fichiers d'extension. On ne bloque pas l'affichage de la liste pour ca :
   la valeur arrive apres coup. */
async function nvCountFill(){
  var keys = [];
  for(var k in stock) if(stock[k]) keys.push(k);
  var el = document.getElementById('nvCount');
  if(!el) return;
  if(!keys.length){ el.textContent = '0'; return; }
  try{ await ensureCards(keys); }catch(e){ return; }
  el = document.getElementById('nvCount');
  if(el) el.textContent = neverList().length;
}

/* ---- Pokemon en stock jamais mis en lot ----
   Un Pokemon est considere comme fait s'il apparait dans le champ Pokemon
   d'un lot, si l'une de ses cartes est rattachee a un lot, ou s'il a ete
   marque a la main (cas des lots realises avant l'arrivee du module). */
function lotPokes(){
  var s = {};
  for(var i=0;i<lots.length;i++){
    var l = lots[i];
    if(l.poke) s[norm(l.poke)] = 1;
    var m = lotCards(l);
    for(var k in m){
      var c = cdbById[k.split('|')[0]];
      if(c) s[norm(c.n)] = 1;
    }
  }
  return s;
}
/* regroupe le stock par nom de Pokemon */
function stockPokes(){
  var g = {};
  for(var k in stock){
    if(!stock[k]) continue;
    var c = cdbById[k.split('|')[0]];
    if(!c) continue;
    var n = norm(c.n);
    if(!g[n]) g[n] = { n: n, nom: c.n, cartes: {}, ex: 0, img: c };
    g[n].cartes[c.i] = 1;
    g[n].ex += stock[k];
  }
  return g;
}
function neverList(){
  var g = stockPokes(), faits = lotPokes(), out = [];
  for(var n in g){
    if(faits[n] || stkDone[n]) continue;
    out.push(g[n]);
  }
  return out;
}

/* ═══ LIAISON LOTS <-> STOCK ═══
   Un lot porte un champ optionnel `cards` : { "cardId|variante|etat": quantite }.
   Champ purement additif : l'ancienne version de l'app le conserve tel quel
   lors d'un enregistrement, puisque mergeInto garde l'objet entier. */

function lotCards(l){ return (l && l.cards) || {}; }
function lotCardCount(l){
  var m = lotCards(l), t = 0;
  for(var k in m) t += m[k];
  return t;
}

/* charge les extensions necessaires pour afficher une liste de cles de stock */
function keysSets(keys){
  var seen = {}, out = [];
  for(var i=0;i<keys.length;i++){
    var id = keys[i].split('|')[0], d = id.lastIndexOf('-');
    var sid = d > 0 ? id.slice(0, d) : id;
    if(!seen[sid]){ seen[sid] = 1; out.push(sid); }
  }
  return out;
}
async function ensureCards(keys){
  var sids = keysSets(keys).filter(function(s){ return !setCards[s]; });
  if(sids.length) { try{ await Promise.all(sids.map(setLoad)); }catch(e){} }
}

/* ---- deplacements ---- */
function lotTake(l, key, n){
  var p = key.split('|');
  if(n > 0){
    if(stkQ(p[0], p[1], p[2]) < n) return false;
    if(!stkAdd(p[0], p[1], p[2], -n, 'lot')) return false;
    l.cards = l.cards || {};
    l.cards[key] = (l.cards[key] || 0) + n;
  } else {
    var have = (l.cards || {})[key] || 0;
    var back = Math.min(have, -n);
    if(!back) return false;
    stkAdd(p[0], p[1], p[2], back, 'retour');
    l.cards[key] -= back;
    if(!l.cards[key]) delete l.cards[key];
  }
  return true;
}
/* remet tout le contenu d'un lot en stock */
function lotRestore(l){
  var m = lotCards(l), n = 0;
  for(var k in m){
    var p = k.split('|');
    stkAdd(p[0], p[1], p[2], m[k], 'retour');
    n += m[k];
  }
  l.cards = {};
  return n;
}

async function pickRender(q){
  var l = pickLot;
  if(!l) return;
  var inLot = lotCards(l);
  var mine = Object.keys(inLot);

  /* resultats disponibles en stock */
  var n = norm(q || ''), avail = [];
  if(n.length >= 2 && nameIdx){
    var ids = {};
    for(var nm in nameIdx){
      if(nm.indexOf(n) < 0) continue;
      var a = nameIdx[nm];
      for(var i=0;i<a.length;i++) ids[a[i]] = 1;
    }
    for(var k in stock){
      var cid = k.split('|')[0];
      if(ids[cid] && stock[k] > 0 && !inLot[k]) avail.push(k);
    }
  }

  /* charger les extensions concernees avant d'afficher, sinon pas de nom ni d'image */
  var all = mine.concat(avail);
  if(all.length) await ensureCards(all);
  if(pickLot !== l) return;

  var nb = lotCardCount(l), s = nb > 1 ? 's' : '';
  var h = '<div class="shT">Cartes du lot</div>' +
          '<div class="shS">' + esc(lotTitle(l)) + ' — ' + nb + ' carte' + s + ' rattachée' + s + '</div>' +
          '<div class="fld"><input class="inp" id="f_pick" placeholder="Chercher un Pokémon…" value="' + esc(q || '') + '"' + noAuto() + '></div>';

  if(mine.length) h += '<div class="pkH">Dans ce lot</div>' + pickRows(mine, inLot);

  if(n.length >= 2){
    h += '<div class="pkH">Disponible en stock</div>';
    h += avail.length ? pickRows(avail, inLot)
                      : '<div class="pkE">Aucun exemplaire en stock pour cette recherche.</div>';
  } else if(!mine.length){
    h += '<div class="pkE">Tape au moins deux lettres pour chercher dans ton stock.</div>';
  }

  h += '<div class="shF"><button class="bP" id="k_pk">Terminé</button></div>';
  if(mine.length) h += '<button class="dgr" id="k_pkr">Tout remettre en stock</button>';

  openSheetKeep(h);

  var inp = $('f_pick');
  if(inp){
    inp.oninput = function(){ clearTimeout(inp._t); inp._t = setTimeout(function(){ pickRender(inp.value); }, 260); };
  }
  $('k_pk').onclick = function(){ commit(pickLot); pickLot = null; closeSheet(); };
  if($('k_pkr')) $('k_pkr').onclick = function(){
    var ll = pickLot;
    confirmBox('Tout remettre en stock ?',
      lotCardCount(ll) + ' carte(s) seront recréditées dans ton stock et détachées de ce lot.',
      'Remettre', function(){
        var n2 = lotRestore(ll);
        commit(ll);
        toast(n2 + ' carte(s) remise(s) en stock');
        pickRender($('f_pick') ? $('f_pick').value : '');
      });
  };
}

function pickRows(keys, inLot){
  keys.sort();
  var h = '';
  for(var i=0;i<keys.length;i++){
    var key = keys[i], p = key.split('|');
    var c = cdbById[p[0]];
    var vs = c ? stkVars(c) : [p[1]];
    var vlbl = (vs.length === 1) ? '' : (VAR_FULL[p[1]] || p[1]);
    var parts = [];
    if(vlbl) parts.push(vlbl);
    if(p[2] !== 'nm') parts.push(ET_LBL[p[2]] || p[2]);
    var si = c ? setInfo(c.s) : null;
    var sub = (c ? 'N° ' + c.u : '') + (si ? ' · ' + si.name : '') + (parts.length ? ' · ' + parts.join(' ') : '');
    var dispo = stkQ(p[0], p[1], p[2]);
    var qte = inLot[key] || 0;

    h += '<div class="pkR">' +
         (c ? cardImg(c, '') : '<span class="pkNo"></span>') +
         '<div class="pkT"><b>' + esc(c ? c.n : p[0]) + '</b><small>' + esc(sub) + '</small>' +
         '<small class="pkD">stock : ' + dispo + '</small></div>' +
         '<div class="pkC">' +
         '<button class="pkB" data-pick="' + esc(key) + '|-1"' + (qte ? '' : ' disabled') + '>−</button>' +
         '<span class="pkQ">' + qte + '</span>' +
         '<button class="pkB" data-pick="' + esc(key) + '|1"' + (dispo ? '' : ' disabled') + '>+</button>' +
         '</div></div>';
  }
  return h;
}

/* remplace le contenu du panneau sans reempiler d'etat d'historique */
function openSheetKeep(html){
  $('sheet').innerHTML = '<div class="grab"></div>' + html;
  if(!sheetOpen){ $('ovl').classList.add('on'); sheetOpen = true; }
}

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-pick]');
  if(!t || !pickLot) return;
  var raw = t.getAttribute('data-pick').split('|');
  var key = raw[0] + '|' + raw[1] + '|' + raw[2];
  var d = parseInt(raw[3], 10);
  if(lotTake(pickLot, key, d)){
    /* enregistrer immediatement : le stock est deja decremente de son cote,
       si le lot n'est pas ecrit les deux sortent de synchro */
    commit(pickLot);
    pickRender($('f_pick') ? $('f_pick').value : '');
  }
  else toast(d > 0 ? 'Plus d\'exemplaire en stock' : 'Rien à retirer');
});

/* filet de securite : quel que soit le chemin de fermeture du selecteur
   (bouton Termine, retour Android, appui hors du panneau), le lot est ecrit */
var _closeSheetPick = closeSheet;
closeSheet = function(){
  if(pickLot){ commit(pickLot); pickLot = null; }
  _closeSheetPick();
};

stkBind();
</script>
</body>
